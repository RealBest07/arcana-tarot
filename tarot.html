<style>
/* ============ BASE ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#0a0a0d;--gold:#b8955a;--gold2:#dcc28c;--ink:#e6dfcf;--muted:#9d978b;--line:rgba(184,149,90,.38);--glass:rgba(17,16,20,.86);--ember:#d98a4a;
  --cw:110px;--ch:calc(var(--cw)*12/7)}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:'Noto Serif Thai','Cinzel',serif;overflow:hidden;overscroll-behavior:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
body{background:radial-gradient(ellipse 90% 55% at 50% 112%,#2a1d14 0%,rgba(42,29,20,0) 70%),radial-gradient(ellipse 80% 50% at 50% -12%,#17171d 0%,rgba(23,23,29,0) 70%),var(--navy)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
/* drifting fog banks between the ash particles and the table */
#fog{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fog i{position:absolute;width:150vmax;height:70vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(150,142,132,.10),rgba(150,142,132,.04) 55%,transparent);will-change:transform}
#fog i:nth-child(1){left:-70vmax;top:35%;animation:fogA 70s ease-in-out infinite alternate}
#fog i:nth-child(2){right:-75vmax;top:-10%;animation:fogB 90s ease-in-out infinite alternate;opacity:.8}
#fog i:nth-child(3){left:-20vmax;bottom:-45vmax;animation:fogA 110s ease-in-out infinite alternate-reverse;opacity:.9}
@keyframes fogA{to{transform:translate(45vmax,-6vmax)}}
@keyframes fogB{to{transform:translate(-40vmax,8vmax)}}
#vign{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}
#stage{position:fixed;inset:0;overflow:hidden;z-index:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gl{opacity:0;visibility:hidden}

/* ============ TITLE / INTRO ============ */
#title{position:fixed;left:50%;top:50%;z-index:9;display:flex;gap:.3em;margin:0;font-family:'Cinzel',serif;font-weight:400;font-size:clamp(40px,14vw,200px);
  color:var(--gold);white-space:nowrap;line-height:1;pointer-events:none;will-change:transform;text-shadow:0 0 30px rgba(184,149,90,.35)}
#title .L{position:relative;display:inline-block;will-change:transform,opacity;opacity:0;visibility:hidden}
#title .L b{font-weight:400}
#title .hi{position:absolute;left:0;top:0;font-style:normal;color:#fff6d6;opacity:0;text-shadow:0 0 18px rgba(255,240,190,.9)}
#tagline{position:fixed;left:50%;top:50%;z-index:9;margin:0;font-size:clamp(14px,2.2vw,20px);font-weight:400;color:var(--muted);text-align:center;width:90vw;opacity:0;visibility:hidden}
#beginBtn{position:fixed;left:50%;top:50%;z-index:9;border:1px solid var(--gold);background:rgba(22,21,26,.5);color:var(--gold2);border-radius:10px;padding:12px 44px;
  font-size:18px;letter-spacing:.02em;transition:background-color .2s,border-color .2s;opacity:0;visibility:hidden}
#beginBtn:hover,#beginBtn:focus-visible{background:rgba(184,149,90,.18);border-color:var(--gold2);outline:none}
#beginBtn:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}

/* ============ HUD ============ */
#hud{position:fixed;top:0;left:0;z-index:10;display:flex;gap:8px;padding:12px 14px;opacity:0;visibility:hidden}
.btn{border:1px solid var(--line);background:rgba(22,21,26,.6);color:var(--gold2);border-radius:10px;padding:8px 16px;font-size:14px;transition:background-color .2s,border-color .2s}
.btn:active{scale:.98}
.btn:hover{border-color:var(--gold2);background:rgba(34,31,36,.8)}
.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,#dcc28c,#c4a066);color:#17130e;border-color:#dcc28c;font-weight:600;padding:12px 28px;font-size:16px}
.btn.small{padding:6px 12px;font-size:13px}
.btn.primary:hover{background:linear-gradient(180deg,#e6cf9e,#cfac72);border-color:#e6cf9e}
/* one line icon set (lucide shapes), one size and stroke, colour from the text */
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

/* ============ TABLE: cards + slots ============ */
/* 3D world: #table(perspective) > #cam(tilt/dolly) > #bob(idle sway) > #world(parallax) */
#table{position:fixed;inset:0;z-index:2;perspective:1700px;perspective-origin:50% 46%;pointer-events:none}
#cam,#bob,#world{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;will-change:transform}
.card,.hov,.sz,.rev,.flip{transform-style:preserve-3d}
/* card art is laid out at --cwx and scaled down to the logical --cw (sharp raster); --u = one on-screen px inside it */
.sz{position:absolute;left:50%;top:50%;width:var(--cwx,110px);height:calc(var(--cwx,110px)*12/7);margin:calc(var(--cwx,110px)*-6/7) 0 0 calc(var(--cwx,110px)/-2);scale:var(--ck,1);--u:calc(1px / var(--ck,1))}
.card,.slot{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);will-change:transform}
.card{outline:none;user-select:none;-webkit-user-select:none;opacity:0;visibility:hidden}
[data-state=reveal] .card.placed,[data-state=reading] .card.placed{pointer-events:auto;cursor:pointer}
.slot svg{width:100%;height:100%;overflow:visible;display:block}
.slot rect{fill:rgba(22,21,26,.28);stroke:var(--gold);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;stroke-opacity:.55;transition:stroke-opacity .4s}
.slot rect{filter:drop-shadow(0 0 3px rgba(220,190,130,.5))}
.slot.next rect{stroke:var(--gold2);stroke-opacity:1;animation:pad 1.6s ease-in-out infinite alternate}
@keyframes pad{from{stroke-opacity:.45}to{stroke-opacity:1}}
.slot.used rect{stroke-opacity:.18}
.slbl{position:absolute;left:50%;top:50%;font-size:13px;color:var(--gold2);white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;opacity:0;visibility:hidden;text-shadow:0 0 6px #0a0a0d,0 0 10px #0a0a0d}
.hov,.rev,.flip,.back,.face{position:absolute;inset:0}
.flip{transform-style:preserve-3d}
.back,.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:5.2%/3%;overflow:hidden}
.back{box-shadow:0 0 0 calc(.7*var(--u)) rgba(220,190,130,.45);background:#15141a var(--backImg) center/100% 100% no-repeat}
.mand{position:absolute;inset:0;background:var(--mandImg) center/100% auto no-repeat}
.card.top .mand,.card.placed .mand{animation:spin 120s linear infinite}
.card.top .back,.card.placed .back{box-shadow:0 calc(4*var(--u)) calc(14*var(--u)) rgba(0,0,0,.6)}
.face{transform:rotateY(180deg)}
.back svg,.face svg,.face img{width:100%;height:100%;display:block}
.card.lift .back{box-shadow:0 0 0 calc(1.5*var(--u)) var(--gold2),0 0 calc(22*var(--u)) calc(5*var(--u)) rgba(220,190,130,.7)}
.card:focus-visible .back,.card:focus-visible .face{box-shadow:0 0 0 calc(2*var(--u)) var(--gold2),0 0 calc(22*var(--u)) calc(5*var(--u)) rgba(220,190,130,.7)}
.card.revealed .face{box-shadow:0 0 calc(18*var(--u)) calc(2*var(--u)) rgba(220,190,130,.4)}
.card.armed .back{box-shadow:0 0 0 calc(2*var(--u)) var(--gold2),0 0 calc(24*var(--u)) calc(6*var(--u)) rgba(220,190,130,.8)}
.rot{transform-box:fill-box;transform-origin:center;animation:spin 120s linear infinite;animation-play-state:paused}
.card.top .rot,.card.placed .rot{animation-play-state:running}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 46s linear infinite}
.tw{animation:tw 2.6s ease-in-out infinite alternate}
.flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-28}}
.cardsvg .s{fill:none;stroke:#d4af6a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cardsvg .t{stroke-width:1.2}
.cardsvg .k{stroke-width:4}
.cardsvg .f{fill:#d4af6a;stroke:none}
.cardsvg .f2{fill:#f2d48a;stroke:none}
.cardsvg .n{fill:#1b2a5c;stroke:#d4af6a;stroke-width:1.8;stroke-linejoin:round}
.cardsvg .d{fill:#0a0a0d;stroke:#d4af6a;stroke-width:1.6;stroke-linejoin:round}
.cardsvg .w{fill:none;stroke:#9db8ff;stroke-width:2;stroke-linecap:round}
.cardsvg .num{font-family:'Cinzel',serif;font-size:22px;fill:#f2d48a;letter-spacing:.12em}
.cardsvg .en{font-family:'Cinzel',serif;font-size:16.5px;fill:#f2d48a;letter-spacing:.06em}
.cardsvg .th{font-family:'Noto Serif Thai',serif;font-size:15px;fill:#d4af6a}
#ripple{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:2px solid var(--gold2);
  box-shadow:0 0 30px rgba(220,190,130,.6),inset 0 0 30px rgba(220,190,130,.4);opacity:0;visibility:hidden;z-index:3;pointer-events:none;will-change:transform,opacity}

.glare{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:5.2%/3%;overflow:hidden;clip-path:inset(0 round 5.2% / 3%);pointer-events:none}
.glare i{position:absolute;inset:-10% -60%;background:linear-gradient(105deg,transparent 38%,rgba(255,244,210,.65) 50%,transparent 62%);opacity:0}
.beam{position:fixed;left:0;top:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,236,180,.9),rgba(220,190,130,.35) 35%,transparent 70%);mix-blend-mode:screen;will-change:transform,opacity}
#halo{position:fixed;left:50%;top:50%;width:min(92vmin,820px);height:min(92vmin,820px);margin:calc(min(92vmin,820px)/-2) 0 0 calc(min(92vmin,820px)/-2);z-index:8;pointer-events:none;opacity:0;visibility:hidden;will-change:transform,opacity}
#halo svg,#halo img{width:100%;height:100%;display:block;animation:spin 140s linear infinite}
#halo img{opacity:.3;filter:drop-shadow(0 0 18px rgba(217,138,74,.35))}
#tagline,#beginBtn{text-shadow:0 0 8px #050507,0 0 16px #050507}
#logoSlot{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9;pointer-events:none}
#logoSlot #title{position:static;font-size:26px;gap:.3em;text-shadow:0 0 14px rgba(184,149,90,.5)}
#title{perspective:900px}
.opt .dg{display:block;height:26px;margin:0 auto 4px}
.opt .dg svg{height:100%;width:auto;overflow:visible}
.opt .dg rect{fill:rgba(184,149,90,.12);stroke:var(--gold);stroke-width:1.2}
.opt[aria-pressed=true] .dg rect{fill:rgba(220,190,130,.4);stroke:var(--gold2)}

/* ============ PANELS ============ */
.panel{position:fixed;z-index:6;left:50%;opacity:0;visibility:hidden;will-change:transform,opacity}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#setup{bottom:max(14px,env(safe-area-inset-bottom));width:min(560px,94vw);padding:14px 16px 16px;display:grid;gap:10px;text-align:center}
#question{width:100%;background:rgba(22,21,26,.7);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 16px;font:inherit;font-size:16px;text-align:center;touch-action:auto}
#question::placeholder{color:#8f8b7d}
#question:focus{outline:none;border-color:var(--gold2);background:rgba(28,26,31,.8)}
.spreads{display:flex;gap:8px}
.opt{flex:1 1 0;min-width:0;border:1px solid var(--line);background:rgba(22,21,26,.7);border-radius:10px;padding:8px 4px;text-align:center;transition:background-color .2s,border-color .2s}
.opt:hover{border-color:rgba(220,194,140,.6)}
.opt b{display:block;font-weight:600;font-size:14.5px}
.opt span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.35}
.opt[aria-pressed=true]{border-color:var(--gold2);background:rgba(184,149,90,.18)}
.opt:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.slider label{display:block;font-size:16px;color:var(--gold2);margin-bottom:2px}
input[type=range]{width:100%;accent-color:var(--gold);touch-action:auto}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 3px}
#shufUI{top:0;width:min(420px,90vw);text-align:center;padding:0}
#counter{margin:0;font-size:clamp(18px,3.4vw,24px);color:var(--gold2);font-variant-numeric:tabular-nums}
#shufKind{margin:2px 0 0;font-size:13px;color:var(--muted)}
#prompt{top:62px;width:min(560px,92vw);text-align:center;margin:0}
#prompt p{margin:0;font-size:clamp(18px,3.4vw,24px);color:var(--gold2)}
#prompt small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
#hintPos{position:fixed;left:50%;top:0;z-index:6;width:min(520px,70vw);pointer-events:none;will-change:transform}
#hintRow{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;visibility:hidden;pointer-events:none}
#hintRow>*{pointer-events:auto}
#hintRow p{margin:0;font-size:clamp(15px,2.6vw,19px);color:var(--gold2)}

/* ============ DOCK (readings) ============ */
#dock{position:fixed;z-index:7;display:flex;flex-direction:column;background:rgba(13,12,16,.93);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;visibility:hidden;will-change:transform,opacity;touch-action:pan-y}
#dock.wide{top:0;right:0;bottom:0;width:var(--dockW);border-radius:16px 0 0 16px}
#dock.narrow{left:0;right:0;bottom:0;height:var(--dockH);border-radius:16px 16px 0 0}
#dockHead{display:flex;align-items:center;min-height:44px;padding:0 14px 0 48px;position:relative;flex:none;border-bottom:1px solid rgba(184,149,90,.2);color:var(--gold2);font-size:15px}
#dockToggle{position:absolute;left:0;top:0;width:46px;height:44px;border:0;background:none;color:var(--gold2);display:flex;align-items:center;justify-content:center}
#dock.narrow #dockToggle svg{transition:transform .5s}#dock.narrow.peek #dockToggle svg{transform:rotate(180deg)}
#dock.wide #dockToggle svg{transform:rotate(-90deg)}
#dockList{overflow-y:auto;overflow-x:hidden;flex:1;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent;touch-action:pan-y}
.rcard{border:1px solid rgba(184,149,90,.28);border-radius:14px;padding:12px 14px;background:rgba(22,21,26,.55);line-height:1.8;font-size:15px;will-change:transform,opacity}
.rcard.sum{border-color:var(--gold2);background:rgba(184,149,90,.1);position:relative}
/* ============ SCENE ART ============ */
#bgimg{position:fixed;inset:-4%;z-index:0;pointer-events:none;background:url(assets/bg.webp) center/cover no-repeat;opacity:0;visibility:hidden;will-change:transform,opacity}
@media (max-aspect-ratio:1/1){#bgimg{background-image:url(assets/bg_m.webp)}}
#altar{position:absolute;left:50%;top:50%;pointer-events:none;opacity:0;visibility:hidden;background:url(assets/table.webp) center/cover;
  -webkit-mask:radial-gradient(ellipse closest-side,#000 52%,transparent 100%);mask:radial-gradient(ellipse closest-side,#000 52%,transparent 100%)}
#altar>i{position:absolute;left:50%;top:50%;width:var(--sig,400px);height:var(--sig,400px);margin:calc(var(--sig,400px)/-2) 0 0 calc(var(--sig,400px)/-2);
  background:url(assets/sigil.webp) center/contain no-repeat;opacity:.3;animation:spin 180s linear infinite;--sr:0deg;rotate:var(--sr)}
.kindled #altar>i{filter:drop-shadow(0 0 14px rgba(255,140,60,.55))}
/* ============ SOULSLIKE ATMOSPHERE ============ */
/* candles on the altar, seen from above */
#altar .cdl{position:absolute;left:calc(50% + var(--sig,400px)*var(--x)*.5);top:calc(50% + var(--sig,400px)*var(--y)*.5);width:0;height:0}
#altar .cdl i{position:absolute;left:0;top:0;border-radius:50%;translate:-50% -50%}
#altar .pool{width:calc(var(--sig,400px)*.55);height:calc(var(--sig,400px)*.55);background:radial-gradient(circle closest-side,rgba(255,160,80,.2),rgba(255,120,50,.07) 50%,transparent);animation:cflick 2.3s var(--d) ease-in-out infinite}
#altar .wax{width:22px;height:22px;background:radial-gradient(circle at 40% 35%,#efe4cc,#b9a685 60%,#6d5d45);box-shadow:0 0 0 3px rgba(40,34,28,.7),0 0 0 6px rgba(255,170,90,.12)}
#altar .flm{width:10px;height:10px;background:radial-gradient(circle,#fff8e0,#ffc261 45%,rgba(255,120,40,0) 75%);box-shadow:0 0 14px 6px rgba(255,170,80,.55);animation:fflick .16s var(--d) infinite alternate}
@keyframes cflick{0%,100%{opacity:.85;scale:1}23%{opacity:1;scale:1.04}41%{opacity:.78;scale:.98}67%{opacity:.95;scale:1.02}}
@keyframes fflick{from{opacity:.8;scale:.9}to{opacity:1;scale:1.12}}
/* lantern: warm pool of light following the pointer, darkness around it */
#lantern{position:fixed;left:0;top:0;width:0;height:0;z-index:3;pointer-events:none}
#lantern::before{content:"";position:absolute;width:300vmax;height:300vmax;left:-150vmax;top:-150vmax;
  background:radial-gradient(circle closest-side,transparent 0,transparent 13%,rgba(0,0,0,.16) 24%,rgba(0,0,0,.4) 46%);transition:opacity .8s}
#lantern i{position:absolute;width:76vmin;height:76vmin;left:-38vmin;top:-38vmin;border-radius:50%;background:radial-gradient(circle closest-side,rgba(255,176,105,.12),rgba(255,140,60,.045) 55%,transparent);animation:lflick 3.4s ease-in-out infinite}
@keyframes lflick{0%,100%{opacity:.9}18%{opacity:1}36%{opacity:.82}52%{opacity:.97}74%{opacity:.86}}
[data-state=gallery] #lantern::before{opacity:.45}
/* the souls banner */
#soulMsg{position:fixed;left:0;right:0;top:50%;translate:0 -50%;z-index:9;pointer-events:none;text-align:center;padding:36px 16px 30px;opacity:0;visibility:hidden;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.8) 16%,rgba(0,0,0,.8) 84%,transparent)}
#soulMsg b{display:block;font-family:'Cinzel',serif;font-weight:400;font-size:clamp(26px,5.2vw,72px);letter-spacing:.14em;color:#e9cf97;text-shadow:0 0 26px rgba(233,170,90,.55),0 0 2px #fff3d0;line-height:1.15}
#soulMsg small{display:block;margin-top:8px;font-size:clamp(13px,1.6vw,18px);letter-spacing:.18em;color:var(--muted)}
/* reversed cards: dark-red fissures */
.crk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:hidden;clip-path:inset(0 round 5.2% / 3%)}
.crk path{fill:none;stroke:#3d0906;stroke-linecap:round;stroke-linejoin:round}
.crk .cg{stroke:rgba(255,70,30,.32)}   /* glow drawn as a wide soft stroke: no filter, so it clips cleanly when the card tilts */
/* burning card face */
.card.burning .face{-webkit-mask-image:radial-gradient(circle at var(--bx,50%) var(--by,80%),transparent calc(var(--burn,0)*1%),#000 calc(var(--burn,0)*1% + 4%));
  mask-image:radial-gradient(circle at var(--bx,50%) var(--by,80%),transparent calc(var(--burn,0)*1%),#000 calc(var(--burn,0)*1% + 4%))}
.card.burning .face::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at var(--bx,50%) var(--by,80%),
  transparent calc(var(--burn,0)*1% - 1%),rgba(255,214,150,.95) calc(var(--burn,0)*1% + .5%),rgba(255,110,30,.9) calc(var(--burn,0)*1% + 2%),

.ember.mote::before{background:radial-gradient(circle,#fff 0,#f2d48a 40%,transparent 72%);animation-duration:.45s}
@keyframes flick{from{opacity:1}to{opacity:.45}}
.drop{width:7px;height:11px;margin:-6px 0 0 -3.5px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:linear-gradient(180deg,#e6efff,#7fa2ff 70%);box-shadow:0 0 6px rgba(157,184,255,.8)}
.wring{width:60px;height:18px;margin:-9px 0 0 -30px;border-radius:50%;border:1.5px solid rgba(157,184,255,.8)}

.coin{width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d0,#f2d48a 38%,#b8893f 80%);border:1px solid #fff0b8;box-shadow:0 0 8px rgba(220,190,130,.85)}
.aura{border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,236,180,.55) 0deg 3deg,transparent 3deg 15deg);-webkit-mask:radial-gradient(circle,#000 16%,transparent 68%);mask:radial-gradient(circle,#000 16%,transparent 68%);mix-blend-mode:screen}

MEANINGS.m06={ku:['ความรัก','ความสัมพันธ์','การเลือก','ความกลมกลืน'],kr:['ไม่ลงรอย','ตัดสินใจผิด','ค่านิยมขัดกัน'],
u:'ความผูกพันที่ลึกซึ้งและการเลือกที่มาจากใจจริงกำลังปรากฏ. ไม่ว่าเรื่องรักหรือเรื่องชีวิต คุณต้องเลือกให้ตรงกับค่านิยมของตัวเอง. ความซื่อสัตย์ต่อใจคือหัวใจสำคัญ.',
r:'ความไม่สมดุลหรือค่านิยมที่ไม่ตรงกันทำให้ความสัมพันธ์สั่นคลอน. การเลือกโดยหนีปัญหาหรือตามใจชั่วขณะอาจนำไปสู่การเสียใจภายหลัง.',
l:['รักแท้ การเชื่อมโยงทางใจ หรือการตัดสินใจเรื่องความรักที่สำคัญ','ความไม่ลงรอย ใจไม่ตรงกัน หรือการนอกใจ'],
c:['ได้ร่วมงานกับคนที่เข้ากัน หรือเลือกเส้นทางที่ตรงใจ','ขัดแย้งกับเพื่อนร่วมงาน หรือลังเลเลือกงานผิด'],
f:['ตัดสินใจร่วมกันเรื่องเงิน ความร่วมมือด้านการเงินที่ดี','ตัดสินใจทางการเงินด้วยอารมณ์ ควรทบทวนอีกครั้ง']};
MEANINGS.m07={ku:['ชัยชนะ','ความมุ่งมั่น','การควบคุมตน','ก้าวไปข้างหน้า'],kr:['ขาดทิศทาง','ก้าวร้าว','เสียการควบคุม'],
u:'ด้วยความมุ่งมั่นและการควบคุมแรงที่ขัดแย้งในตัว คุณจะฝ่าอุปสรรคไปสู่ชัยชนะ. มีเป้าหมายชัดแล้วทุ่มเทเต็มที่. ความมีวินัยจะพาคุณไปถึง.',
r:'พลังที่กระจัดกระจายหรือการรีบเร่งเกินไปทำให้ไปผิดทิศ. ความก้าวร้าวหรือการยัดเยียดจะส่งผลเสีย ลองกลับมาหาจุดมุ่งหมายก่อนเดินต่อ.',
l:['ความรักที่ก้าวหน้า การเดินทางร่วมกัน หรือเอาชนะอุปสรรคด้วยกัน','ต่างคนต่างไปคนละทาง หรือการแข่งขันในความสัมพันธ์'],
c:['ความก้าวหน้าในอาชีพ ชนะการแข่งขัน หรือเดินทางเพื่องาน','งานขาดทิศทาง หรือใจร้อนจนผิดพลาด'],
f:['รายได้เพิ่มจากความพยายาม ใช้เงินเพื่อเป้าหมายที่ชัด','ใช้จ่ายเกินตัวหรือเสียการควบคุมแผนการเงิน']};
MEANINGS.m08={ku:['ความกล้าหาญ','ความอดทน','เมตตา','พลังภายใน'],kr:['สงสัยตัวเอง','อ่อนล้า','ใช้อารมณ์'],
u:'ความเข้มแข็งที่แท้จริงมาจากความอ่อนโยนและความอดทน ไม่ใช่การใช้กำลัง. คุณสามารถเอาชนะความกลัวและอารมณ์ดิบด้วยความเมตตาต่อตัวเอง. เชื่อมั่นในพลังภายใน.',
r:'ความไม่มั่นใจหรือความเหนื่อยล้ากำลังกัดกร่อนพลังใจ. อารมณ์อาจครอบงำเหตุผล ลองกลับมาปรับสมดุลและเติมกำลังใจให้ตัวเอง.',
l:['ความรักที่อ่อนโยนและอดทน ผ่านความยากไปด้วยกัน','ความไม่มั่นใจในความสัมพันธ์ หรืออารมณ์รุนแรง'],
c:['ผ่านงานท้าทายได้ด้วยความอดทน ภาวะผู้นำที่นุ่มนวล','ท้อ หมดไฟ หรือรู้สึกว่าไม่เก่งพอ'],
f:['อดทนสะสมทรัพย์ ควบคุมความอยากจับจ่าย','ใช้เงินตามอารมณ์ หรือขาดความมั่นใจจนพลาดโอกาส']};
MEANINGS.m09={ku:['การไตร่ตรอง','ความโดดเดี่ยวเพื่อค้นหา','ปัญญา','การนำทางภายใน'],kr:['แยกตัวเกินไป','เหงา','หลีกหนีโลก'],
u:'ถึงเวลาถอยออกมาจากความวุ่นวายเพื่อค้นหาคำตอบภายในตัวเอง. ความเงียบสงบจะนำแสงสว่างมาให้ ขอคำแนะนำจากผู้มีประสบการณ์ได้. เป็นช่วงของการเติบโตทางจิตใจ.',
r:'การแยกตัวอาจกลายเป็นความเหงาหรือการหนีโลก. หรือคุณกำลังเมินคำแนะนำที่มีค่า ลองกลับมาเชื่อมต่อกับผู้คนอย่างพอดี.',
l:['ช่วงใคร่ครวญว่าต้องการอะไรจากความรัก หรืออยู่คนเดียวเพื่อเข้าใจตัวเอง','โดดเดี่ยวเกินไป ปิดใจจากคนที่หวังดี'],
c:['พักคิดทบทวนเส้นทางอาชีพ ศึกษาเชิงลึก หรือมีที่ปรึกษา','ทำงานคนเดียวจนขาดการสนับสนุน หรือไม่ยอมรับคำแนะนำ'],
f:['ทบทวนงบการเงินอย่างรอบคอบ ไม่ต้องรีบตัดสินใจ','ปิดตัวจากข้อมูลการเงิน หรือมองไม่เห็นภาพรวม']};
MEANINGS.m10={ku:['โชคชะตา','วัฏจักร','จุดเปลี่ยน','โอกาส'],kr:['โชคร้ายชั่วคราว','ต่อต้านการเปลี่ยนแปลง','วนซ้ำ'],
u:'กงล้อกำลังหมุน สถานการณ์ของคุณกำลังเข้าสู่จุดเปลี่ยนที่นำโชคและโอกาสมาให้. ทุกสิ่งมีขึ้นมีลง ยอมรับจังหวะของชีวิตแล้วฉวยโอกาสที่มาถึง.',
r:'ช่วงนี้อาจรู้สึกว่าโชคไม่เข้าข้างหรือวนอยู่กับปัญหาเดิม. การขัดขืนการเปลี่ยนแปลงทำให้เหนื่อยกว่าเดิม มองหาบทเรียนที่ซ่อนอยู่.',
l:['จังหวะดีของความรัก พบเนื้อคู่ หรือความสัมพันธ์ก้าวหน้า','ความสัมพันธ์วนซ้ำรูปแบบเดิม หรือจังหวะยังไม่ลงตัว'],
c:['โอกาสเลื่อนตำแหน่งหรือเปลี่ยนงานที่เปลี่ยนชีวิต','งานสะดุดชั่วคราว ตลาดผันผวน'],
f:['โชคทางการเงินดีขึ้น มีรายรับไม่คาดคิด','การเงินผันผวน ควรระวังการลงทุนเสี่ยงสูง']};
MEANINGS.m11={ku:['ความยุติธรรม','ความจริง','เหตุและผล','ความสมดุล'],kr:['ไม่ยุติธรรม','หลบเลี่ยงความรับผิดชอบ','ตัดสินลำเอียง'],
u:'การกระทำทุกอย่างมีผลตามมา ความจริงและความซื่อตรงจะถูกยืนยัน. ตัดสินใจอย่างมีเหตุผลและเป็นกลาง. เรื่องกฎหมายหรือสัญญาจะคลี่คลายอย่างเป็นธรรม.',
r:'อาจมีความไม่เป็นธรรมหรือการหลบเลี่ยงความรับผิดชอบ. อคติของตัวเองหรือคนอื่นบดบังความจริง ตรวจสอบข้อเท็จจริงให้ครบก่อนตัดสิน.',
l:['ความสัมพันธ์ที่เท่าเทียม จริงใจ หรือการตัดสินใจอย่างเป็นธรรม','ไม่เป็นธรรมในความสัมพันธ์ หรือหลบเลี่ยงความรับผิดชอบ'],
c:['ได้รับการประเมินอย่างเป็นธรรม สัญญาและข้อตกลงชัดเจน','ถูกเอาเปรียบ หรือปัญหาเรื่องสัญญาและกฎหมาย'],
f:['การเงินเที่ยงตรง ชำระหนี้ตามกำหนด ผลตามความพยายาม','ปัญหาภาษีหรือสัญญา ควรอ่านรายละเอียดให้ครบ']};
MEANINGS.m12={ku:['การปล่อยวาง','มุมมองใหม่','การเสียสละ','รอคอย'],kr:['ติดอยู่กับที่','ต่อต้านการปล่อย','เสียสละเปล่า'],
u:'หยุดเพื่อมองสิ่งต่าง ๆ จากมุมกลับ ความล่าช้าตอนนี้กำลังพาคุณไปสู่ความเข้าใจใหม่. ยอมปล่อยวางสิ่งที่ยึดไว้ แล้วคำตอบจะปรากฏ.',
r:'คุณอาจรู้สึกติดอยู่แต่ยังไม่ยอมเปลี่ยนมุมมอง หรือเสียสละโดยไม่ได้อะไรกลับมา. ถึงเวลาตัดสินใจเลิกรอและลงมือ.',
l:['ชะลอความสัมพันธ์เพื่อทบทวน หรือยอมเสียสละเพื่อคนรัก','ติดกับความสัมพันธ์ที่ไม่ไปไหน หรือเสียสละฝ่ายเดียว'],
c:['งานชะงักชั่วคราว ใช้เวลานี้เปลี่ยนมุมมองและเรียนรู้','รอนานเกินไป ถึงเวลาลงมือเปลี่ยนแปลง'],
f:['ชะลอการตัดสินใจทางการเงิน ปรับมุมมองใหม่','ติดหล่มการเงิน ควรหาทางออกแทนการรอ']};
MEANINGS.m13={ku:['การสิ้นสุด','การเปลี่ยนผ่าน','การเกิดใหม่','ปล่อยของเก่า'],kr:['ต่อต้านการเปลี่ยน','ยึดติดอดีต','ชะงักงัน'],
u:'ไพ่ใบนี้ไม่ได้แปลว่าตายจริง แต่คือการปิดฉากบางสิ่งเพื่อเปิดทางให้ของใหม่. การเปลี่ยนแปลงครั้งใหญ่กำลังมา ปล่อยของเก่าไปแล้วคุณจะเบาขึ้น.',
r:'การยึดติดกับสิ่งที่จบไปแล้วทำให้ชีวิตชะงัก. การเปลี่ยนแปลงที่ถูกหน่วงไว้จะยิ่งเจ็บปวด ยอมรับความจริงและเดินหน้า.',
l:['จบความสัมพันธ์เดิมเพื่อเริ่มใหม่ หรือความสัมพันธ์เปลี่ยนรูปแบบ','ยื้อความสัมพันธ์ที่จบแล้ว ไม่ยอมปล่อย'],
c:['จบงานเดิมเพื่อเริ่มบทใหม่ ปรับโครงสร้างครั้งใหญ่','กลัวการเปลี่ยนงานจนชะงัก'],
f:['ปิดบัญชีหรือเลิกรูปแบบเดิมเพื่อเริ่มระบบใหม่','ยึดติดวิธีเดิมที่ไม่ได้ผล ควรปรับเปลี่ยน']};
MEANINGS.m14={ku:['ความพอดี','สมดุล','ความอดทน','การผสมผสาน'],kr:['ไม่สมดุล','สุดโต่ง','รีบร้อน'],
u:'ผสมผสานสิ่งต่าง ๆ อย่างพอดีและใจเย็น ความสมดุลคือคำตอบ. ค่อย ๆ ปรับทีละนิดจะได้ผลยั่งยืนกว่าการรีบ. เป็นช่วงฟื้นฟูและเยียวยา.',
r:'ชีวิตเอียงไปด้านใดด้านหนึ่งมากเกินไป ทั้งการทำงาน การใช้จ่าย หรืออารมณ์. ความใจร้อนทำให้เสียจังหวะ ลองกลับมาหาทางสายกลาง.',
l:['ความสัมพันธ์กลมกลืน เข้าใจและปรับตัวเข้าหากัน','ให้และรับไม่สมดุล หรือความคาดหวังต่างกัน'],
c:['ทำงานเป็นทีมและบริหารเวลาได้ดี สมดุลงานกับชีวิต','งานล้นมือหรือทำงานหนักเกิน ขาดสมดุล'],
f:['บริหารการเงินพอดี ออมและใช้ในสัดส่วนที่เหมาะ','ใช้จ่ายสุดโต่ง ขาดแผนระยะยาว']};
MEANINGS.m15={ku:['การยึดติด','ความอยาก','พันธนาการ','เงามืดของตัวเอง'],kr:['หลุดพ้น','ตระหนักรู้','ทวงอิสรภาพ'],
u:'บางสิ่งกำลังผูกมัดคุณ อาจเป็นนิสัย ความอยาก ความสัมพันธ์ หรือความกลัว. สิ่งที่ล่ามไว้หลวมกว่าที่คิด คุณเลือกที่จะหลุดได้เสมอ.',
r:'คุณเริ่มมองเห็นสิ่งที่พันธนาการอยู่และกำลังก้าวออกมา. การปลดปล่อยอาจไม่ง่ายแต่คือจุดเริ่มต้นของอิสรภาพ.',
l:['ความหลงใหลที่รุนแรงหรือความสัมพันธ์แบบพึ่งพา','หลุดจากความสัมพันธ์ที่เป็นพิษ เริ่มรักตัวเอง'],
c:['ติดงานที่ไม่ใช่ หรือถูกกดดันจากเงินและอำนาจ','เริ่มหาทางออกจากงานที่บั่นทอน'],
f:['ใช้จ่ายตามความอยาก หนี้สินที่ผูกมัด','เริ่มเห็นปัญหาการเงินและวางแผนปลดหนี้']};
MEANINGS.m16={ku:['การเปลี่ยนแปลงฉับพลัน','ความจริงเปิดเผย','พังทลาย','การปลดปล่อย'],kr:['หลีกเลี่ยงหายนะ','กลัวเปลี่ยน','ผลกระทบที่ยืดเยื้อ'],
u:'สิ่งที่สร้างบนรากฐานที่ไม่มั่นคงกำลังพังลงอย่างฉับพลัน แม้เจ็บแต่ก็เปิดทางให้ของจริง. ยอมรับความจริงที่ปรากฏแล้วสร้างใหม่ให้แข็งแรงกว่าเดิม.',
r:'คุณอาจหลีกเลี่ยงการเปลี่ยนแปลงที่จำเป็น หรือยังคงแบกผลกระทบจากวิกฤตเดิมอยู่. การยื้อทำให้ปัญหาลากยาว เผชิญหน้าอย่างตรงไปตรงมา.',
l:['ความสัมพันธ์สั่นสะเทือน ความจริงถูกเปิดเผย แต่นำสู่ความจริงใจ','ประคองความสัมพันธ์ที่ร้าวไว้ ไม่กล้าเผชิญหน้า'],
c:['งานเปลี่ยนกะทันหัน ปรับโครงสร้างหรือตกงาน แต่เปิดโอกาสใหม่','เลี่ยงวิกฤตงานได้ แต่ปัญหายังคุอยู่'],
f:['เหตุการณ์ไม่คาดฝันกระทบการเงิน ควรมีเงินสำรอง','ใกล้เจอปัญหาเงินแต่หลบทัน ควรรีบแก้รากฐาน']};
MEANINGS.m17={ku:['ความหวัง','การเยียวยา','แรงบันดาลใจ','ศรัทธา'],kr:['หมดหวัง','ขาดศรัทธา','ท้อแท้'],
u:'หลังพายุผ่านไป ดวงดาวคือความหวังและการเยียวยา. จงเชื่อว่าชีวิตกำลังดีขึ้น และปล่อยให้แรงบันดาลใจนำทาง. ช่วงเวลาแห่งความสงบและการเติมพลัง.',
r:'ความท้อแท้หรือการสูญเสียศรัทธาทำให้มองไม่เห็นแสงสว่าง. ลองเริ่มจากสิ่งเล็ก ๆ ที่ช่วยเติมพลังใจ แล้วความหวังจะค่อย ๆ กลับมา.',
l:['ความรักที่เยียวยา มีความหวังและความจริงใจ','ขาดความหวังในความสัมพันธ์ ท้อแท้'],
c:['อนาคตสดใส ได้แรงบันดาลใจใหม่ในอาชีพ','หมดไฟ ขาดทิศทาง'],
f:['การเงินค่อย ๆ ฟื้นตัว มีแผนระยะยาวที่ดี','มองการเงินในแง่ร้ายเกินไป ควรตั้งเป้าใหม่']};
MEANINGS.m18={ku:['ความกลัว','ภาพลวงตา','จิตใต้สำนึก','ความไม่แน่นอน'],kr:['ความกลัวคลี่คลาย','ความจริงปรากฏ','ความสับสนลดลง'],
u:'สิ่งที่เห็นอาจไม่ใช่ความจริงทั้งหมด ความกลัวและจินตนาการอาจบิดเบือนมุมมอง. เดินอย่างระมัดระวังและเชื่อสัญชาตญาณ แต่อย่าตัดสินใจด้วยอารมณ์ที่ไม่ชัด.',
r:'หมอกเริ่มจางลง ความจริงที่ซ่อนอยู่เริ่มปรากฏ. คุณกำลังเข้าใจความกลัวของตัวเองมากขึ้น แต่ยังควรตรวจสอบข้อมูลก่อนเชื่อ.',
l:['ความไม่มั่นใจ ความสงสัย หรือความลับในความสัมพันธ์','ความเข้าใจผิดคลี่คลาย ความจริงปรากฏ'],
c:['สถานการณ์งานคลุมเครือ ระวังข้อมูลที่ไม่ครบ','ความสับสนที่ทำงานเริ่มชัดขึ้น'],
f:['อย่าตัดสินใจเรื่องเงินตอนที่ข้อมูลไม่ชัด ระวังภาพลวงตา','ความจริงทางการเงินปรากฏ เริ่มวางแผนได้']};
MEANINGS.m19={ku:['ความสุข','ความสำเร็จ','พลังบวก','ความชัดเจน'],kr:['สุขชั่วคราว','มองโลกดีเกินไป','พลังตก'],
u:'แสงสว่างส่องทุกมุม ความสำเร็จ ความสุข และความมั่นใจกำลังมาถึง. เป็นไพ่ที่ให้พลังบวกที่สุดใบหนึ่ง ใช้ช่วงเวลานี้เบ่งบานและแบ่งปัน.',
r:'ความสุขอาจยังไม่เต็มที่ หรือมองโลกในแง่ดีจนละเลยรายละเอียด. พลังงานอาจตกชั่วคราว พักผ่อนแล้วจะกลับมาสดใส.',
l:['ความรักสดใส ความสุขร่วมกัน อาจหมายถึงข่าวดีหรือเด็ก','ความสัมพันธ์ดีแต่ยังขาดอะไรบางอย่าง ความสุขไม่เต็มที่'],
c:['ความสำเร็จเป็นที่ยอมรับ โปรเจกต์ออกมาดี','ผลงานยังไม่ได้รับการยอมรับ ตรวจรายละเอียดอีกที'],
f:['การเงินรุ่งเรือง ผลตอบแทนดี','มีรายได้แต่อย่ามั่นใจจนประมาท']};
MEANINGS.m20={ku:['การตื่นรู้','การเรียกร้อง','การให้อภัย','การประเมินชีวิต'],kr:['สงสัยตัวเอง','ปฏิเสธเสียงเรียก','ติดอยู่กับอดีต'],
u:'ถึงเวลาทบทวนเส้นทางที่ผ่านมาและตอบรับเสียงเรียกของตัวเอง. การให้อภัยและการเริ่มต้นใหม่จากบทเรียนในอดีตคือสิ่งที่ไพ่แนะนำ. ตื่นขึ้นแล้วก้าวสู่ระดับถัดไป.',
r:'ความสงสัยในตัวเองหรือความรู้สึกผิดทำให้คุณไม่ยอมตอบรับโอกาส. การตัดสินตัวเองรุนแรงเกินไปทำให้ติดอยู่ ลองให้อภัยตัวเองก่อน.',
l:['เริ่มต้นใหม่ในความรัก ให้อภัยและกลับมาคืนดี','ติดอยู่กับอดีต ไม่ให้อภัยตัวเองหรือคนรัก'],
c:['จุดเปลี่ยนในอาชีพ ได้ทำสิ่งที่ใช่ในที่สุด','ลังเลหรือกลัวถูกตัดสินจึงไม่ก้าวต่อ'],
f:['ทบทวนการเงินและเริ่มระบบใหม่ที่ดีกว่า','ไม่ยอมรับความผิดพลาดทางการเงิน ควรเรียนรู้แล้วเดินต่อ']};
MEANINGS.m21={ku:['ความสำเร็จสมบูรณ์','การครบวงจร','ความสมบูรณ์','การเดินทางสู่ใหม่'],kr:['ยังไม่จบ','ขาดความสมบูรณ์','ลังเลก่อนปิดฉาก'],
u:'วงจรสำคัญของชีวิตกำลังจบอย่างสมบูรณ์ คุณเรียนรู้และเติบโตมาถึงจุดนี้. ฉลองความสำเร็จ แล้วเตรียมเปิดเส้นทางใหม่ที่กว้างกว่าเดิม.',
r:'ยังมีบางอย่างค้างอยู่ทำให้ไม่ถึงความสมบูรณ์ หรือคุณกลัวที่จะปิดฉากสิ่งเดิม. ลองสะสางส่วนที่ค้าง แล้วก้าวต่ออย่างมั่นใจ.',
l:['ความสัมพันธ์สมบูรณ์ ลงตัวและมั่นคง','ยังขาดอะไรบางอย่าง หรือยังจบบทเดิมไม่หมด'],
c:['ความสำเร็จครบถ้วน ได้รับรางวัลหรือเปิดตลาดระดับใหม่','เกือบสำเร็จแต่ยังมีส่วนค้าง ต้องปิดงานให้เรียบร้อย'],
f:['การเงินมั่นคงตามเป้าหมาย ผลตอบแทนครบวงจร','ยังไม่ถึงเป้าหมาย ต้องอดทนอีกนิด']};

/* ---- Cups (ถ้วย) : อารมณ์ ความรัก ความสัมพันธ์ ---- */
MEANINGS.cups01={ku:['ความรักใหม่','ความรู้สึกท่วมท้น','จิตวิญญาณ','ความเมตตา'],kr:['อารมณ์อัดอั้น','ปิดใจ','ความว่างเปล่า'],
u:'หัวใจของคุณกำลังเปิดรับความรักและความรู้สึกดี ๆ ครั้งใหม่. พลังอารมณ์ที่ล้นเอ่อพร้อมให้ความเมตตาและความสร้างสรรค์. เป็นจุดเริ่มต้นที่งดงามของความผูกพัน.',
r:'อารมณ์ที่ถูกกดไว้หรือการปิดใจทำให้ความรู้สึกแห้งเหือด. อาจรู้สึกว่างเปล่าหรือให้ไม่ได้ ลองเยียวยาใจตัวเองก่อนแล้วค่อยเปิดรับ.',
l:['ความรักใหม่ ความรู้สึกดี ๆ เริ่มต้น','ปิดใจ กลัวเจ็บ ความรู้สึกถูกกด'],
c:['งานที่ตรงกับใจ ไอเดียสร้างสรรค์เริ่มเกิด','หมดแรงบันดาลใจในงาน'],
f:['ได้รับสิ่งดี ๆ โดยไม่คาดคิด ใจกว้างให้และรับ','ใช้เงินปลอบอารมณ์ ควรระวัง']};
MEANINGS.cups02={ku:['ความร่วมมือ','ความรักที่เท่าเทียม','ความเข้าใจ','การเชื่อมใจ'],kr:['ความไม่ลงรอย','ความสัมพันธ์ไม่สมดุล','การแยกทาง'],
u:'สองใจมาพบกันด้วยความเคารพและความเข้าใจซึ่งกันและกัน. ความสัมพันธ์ ไม่ว่ารักหรือหุ้นส่วน จะเติบโตด้วยการให้และรับที่สมดุล.',
r:'การสื่อสารขาดช่วงหรือฝ่ายหนึ่งให้มากกว่ากันทำให้สัมพันธ์สั่นคลอน. ถึงเวลาคุยกันตรง ๆ หรือยอมรับว่าอาจเดินคนละทาง.',
l:['คู่รักที่เข้าใจกัน การหมั้นหมายหรือตกลงใจร่วมกัน','เข้ากันไม่ได้ ทะเลาะกัน หรือห่างเหิน'],
c:['หุ้นส่วนหรือการร่วมงานที่ดี','ความร่วมมือมีปัญหา ขัดแย้งในทีม'],
f:['ร่วมลงทุนหรือแบ่งปันทรัพยากรอย่างยุติธรรม','ข้อตกลงทางการเงินไม่ลงตัว']};
MEANINGS.cups03={ku:['การเฉลิมฉลอง','มิตรภาพ','ความสุขร่วมกัน','ชุมชน'],kr:['ความสุขเกินพอดี','ซุบซิบ','ถูกทิ้งห่าง'],
u:'ช่วงเวลาแห่งการฉลองและความสุขกับคนที่รัก. มิตรภาพและชุมชนคอยหนุนให้คุณชื่นใจ. แบ่งปันความสำเร็จและขอบคุณคนรอบข้าง.',
r:'ความสนุกเกินขอบเขตหรือเรื่องซุบซิบอาจสร้างรอยร้าว. หรือรู้สึกโดดเดี่ยวจากกลุ่ม ลองเลือกคนที่จริงใจ.',
l:['งานเลี้ยง งานแต่ง หรือความสุขกับเพื่อนและคนรัก','สามเส้า ข่าวลือ หรือความสัมพันธ์ที่ผิวเผิน'],
c:['ทีมที่เข้ากัน ฉลองความสำเร็จ','ซุบซิบ การเมืองในที่ทำงาน'],
f:['รายได้จากความร่วมมือ การเลี้ยงฉลอง','ใช้จ่ายสังสรรค์เกินตัว']};
MEANINGS.cups04={ku:['ความเบื่อหน่าย','การครุ่นคิด','ไม่สนใจโอกาส','พิจารณาใหม่'],kr:['ตื่นรู้','เปิดรับโอกาส','ออกจากความเฉื่อย'],
u:'คุณอาจรู้สึกจืดชืดและมองข้ามสิ่งดี ๆ ที่ยื่นมา เพราะมัวจมอยู่กับความไม่พอใจ. ลองถามตัวเองว่าต้องการอะไรจริง ๆ ก่อนจะปิดโอกาสทั้งหมด.',
r:'คุณเริ่มลืมตาเห็นโอกาสที่ถูกมองข้ามและพร้อมลงมือ. ความเบื่อกำลังเปลี่ยนเป็นแรงผลักให้เริ่มสิ่งใหม่.',
l:['เบื่อในความสัมพันธ์ หรือมองข้ามคนที่หวังดี','กลับมาเห็นคุณค่าของความรักที่มี หรือเปิดใจใหม่'],
c:['งานซ้ำซากจนหมดความตื่นเต้น','พร้อมรับข้อเสนอหรือโอกาสใหม่'],
f:['ไม่สนใจโอกาสทางการเงินที่เข้ามา','ตัดสินใจลงมือกับโอกาสที่เคยปฏิเสธ']};
MEANINGS.cups05={ku:['ความเสียใจ','การสูญเสีย','ความผิดหวัง','เหลือสิ่งดีอยู่'],kr:['ยอมรับ','เยียวยา','ก้าวต่อ'],
u:'คุณกำลังจดจ่ออยู่กับสิ่งที่เสียไปจนมองไม่เห็นว่ายังมีบางอย่างเหลืออยู่. ความเศร้าเป็นเรื่องธรรมชาติ ให้เวลาตัวเองได้ไว้ทุกข์ แล้วค่อยหันกลับมามอง.',
r:'ความเศร้ากำลังบรรเทา คุณเริ่มยอมรับสิ่งที่เกิดขึ้นและพร้อมก้าวต่อ. การให้อภัยตัวเองและผู้อื่นคือทางไปข้างหน้า.',
l:['อกหัก ผิดหวัง หรือเสียใจกับอดีตความรัก','เริ่มเยียวยาและเปิดใจกับความสัมพันธ์ใหม่'],
c:['ผิดหวังกับผลงานหรือโอกาสที่หลุดไป','เรียนรู้จากความผิดพลาดแล้วเริ่มใหม่'],
f:['เสียเงินหรือการลงทุนไม่เป็นไปตามหวัง','ฟื้นตัวทางการเงิน ตั้งหลักได้']};
MEANINGS.cups06={ku:['ความทรงจำ','ความไร้เดียงสา','ของขวัญ','ความคิดถึง'],kr:['ติดอดีต','ไม่ยอมโต','ความสัมพันธ์เก่าวนกลับ'],
u:'ความทรงจำแสนดีหรือคนเก่าแก่หวนกลับมาเติมความอบอุ่น. ความใจดี ความจริงใจ และการให้แบบไม่หวังผลคือพลังของไพ่ใบนี้.',
r:'การจมอยู่กับอดีตทำให้ไม่ก้าวไปข้างหน้า หรือมองอดีตในแง่สวยเกินจริง. ถึงเวลาโอบรับปัจจุบันและเติบโต.',
l:['คนเก่ากลับมา ความรักวัยเด็ก หรือความรักที่อ่อนโยน','ติดอยู่กับคนรักเก่า ไม่ยอมปล่อย'],
c:['ทำงานกับคนคุ้นเคย หรือกลับไปสู่งานเดิม','ยึดวิธีเก่า ไม่ปรับตัวกับของใหม่'],
f:['ได้รับของขวัญหรือมรดก การเงินจากครอบครัว','ใช้เงินกับความหลัง ระวังพึ่งพาคนอื่นเกินไป']};
MEANINGS.cups07={ku:['ตัวเลือกมากมาย','จินตนาการ','ความฝัน','ภาพลวงตา'],kr:['ชัดเจนขึ้น','ตัดสินใจได้','ถอนตัวจากความฝันลอย'],
u:'ตัวเลือกมากมายล่อใจจนสับสนว่าอะไรจริงอะไรเพ้อฝัน. อย่าหลงภาพลวงตา ลองเลือกสิ่งที่ตรงกับคุณค่าของตนและลงมือแทนการฝันลอย ๆ.',
r:'ความชัดเจนเริ่มมา คุณเริ่มแยกความจริงออกจากความฝันและกล้าเลือกทางเดียว. เป็นเวลาลงมือมากกว่าลังเล.',
l:['คนเข้ามาหลายคนจนลังเล ความคาดหวังสูง','ตัดสินใจเลือกได้ เลิกฝันลอย'],
c:['ไอเดียมากแต่ไม่ลงมือ งานหลายทางเลือก','เลือกทางหลักและเริ่มลงมือ'],
f:['อย่าหลงโครงการที่ดูดีเกินจริง','ได้ภาพรวมการเงินชัด ตัดสินใจรอบคอบ']};
MEANINGS.cups08={ku:['การจากไป','ละทิ้งสิ่งเดิม','ค้นหาความหมาย','ก้าวออกมา'],kr:['กลัวไป','ติดอยู่','หนีปัญหา'],
u:'แม้ทุกอย่างดูพอใช้ แต่ใจรู้ว่ายังไม่ใช่ จึงเลือกก้าวออกจากสิ่งที่ไม่ตอบโจทย์เพื่อค้นหาสิ่งที่ลึกกว่า. การจากลาครั้งนี้เกิดจากความกล้า ไม่ใช่ความอ่อนแอ.',
r:'คุณอาจกลัวการจากไปแม้จะรู้ว่าไม่มีความสุข หรือกำลังหนีปัญหาโดยไม่แก้. ลองถามตัวเองว่ากำลังก้าวไปสู่สิ่งใหม่หรือหนีจากบางอย่าง.',
l:['ตัดสินใจออกจากความสัมพันธ์ที่ไม่เติมเต็ม','ยื้อความสัมพันธ์เดิม หรือหนีแทนที่จะคุย'],
c:['ลาออกหรือเปลี่ยนสายงานเพื่อความหมายใหม่','ติดอยู่ในงานที่ไม่ใช่ เพราะกลัวเปลี่ยน'],
f:['ละทิ้งการลงทุนที่ไม่ตอบโจทย์','หนีปัญหาการเงินแทนที่จะจัดการ']};
MEANINGS.cups09={ku:['ความพึงพอใจ','ความปรารถนาที่เป็นจริง','ความสุขทางใจ','ความภาคภูมิใจ'],kr:['ไม่พอ','หลงตัวเอง','สุขเพียงผิว'],
u:'ไพ่แห่งความปรารถนาที่เป็นจริง คุณได้รับสิ่งที่ตั้งใจและควรชื่นชมกับมัน. ความอิ่มเอมใจและความสุขจากความสำเร็จเป็นของคุณ.',
r:'ความต้องการที่ได้มาไม่เติมเต็มจริง หรือหลงระเริงกับความสุขเฉพาะหน้า. ลองดูว่าสิ่งที่ตามหาคือความสุขแท้หรือความฉาบฉวย.',
l:['ความรักที่เติมเต็ม ความปรารถนาเป็นจริง','ความสุขแค่ผิวเผิน หรือมีความต้องการที่ยังไม่พอ'],
c:['งานที่ภาคภูมิใจ ได้รับรางวัลหรือคำชม','พอใจกับสิ่งที่ไม่ได้อยากได้จริง'],
f:['ความมั่งคั่งและความสบายใจ ได้ตามต้องการ','ใช้จ่ายเพื่อความสุขชั่วคราวเกินไป']};
MEANINGS.cups10={ku:['ความสุขในครอบครัว','ความสมบูรณ์ทางใจ','ความกลมเกลียว','ความสงบ'],kr:['ครอบครัวไม่ลงรอย','ความสุขที่ไม่เป็นจริง','ภาพลักษณ์ปลอม'],
u:'ความสุขที่ลึกซึ้งในครอบครัวและความสัมพันธ์ที่อบอุ่นมั่นคง. ใจสงบ ทุกคนสนับสนุนกัน คือบ้านทางใจที่คุณเฝ้ามอง.',
r:'ภายนอกดูดีแต่ภายในมีรอยร้าว หรือความขัดแย้งในครอบครัวทำให้ความสุขสะดุด. เริ่มจากการพูดคุยอย่างเปิดอกเพื่อซ่อมแซม.',
l:['ความรักมั่นคง ครอบครัวอบอุ่น แต่งงานหรือสร้างบ้านด้วยกัน','ครอบครัวไม่เข้าใจ หรือความสัมพันธ์ที่ดูดีแต่ไม่จริง'],
c:['ที่ทำงานที่เหมือนครอบครัว ความสุขในงาน','บรรยากาศงานตึงเครียด ไม่ลงรอยกัน'],
f:['ความมั่นคงทางการเงินของครอบครัว','ปัญหาการเงินที่ก่อความไม่ลงรอยในบ้าน']};
MEANINGS.cups11={ku:['ข่าวดีทางใจ','ความอ่อนไหว','ความสร้างสรรค์','ความรักใหม่'],kr:['อารมณ์ไม่มั่นคง','ไร้เดียงสาเกิน','ข่าวไม่ดี'],
u:'ผู้ส่งสารแห่งความรู้สึกเข้ามาพร้อมข่าวดี คำเชิญ หรือแรงบันดาลใจ. เปิดใจรับความอ่อนโยนและความคิดสร้างสรรค์ แต่อย่าลืมฟังหัวใจตัวเอง.',
r:'ความอ่อนไหวเกินไปทำให้อารมณ์แปรปรวน หรือข่าวที่ได้ไม่เป็นอย่างหวัง. ฝึกเข้าใจและจัดการความรู้สึกให้นิ่งขึ้น.',
l:['ข่าวดีเรื่องรัก คนที่เข้ามาด้วยความจริงใจ','อารมณ์เปราะบาง เด็กในใจที่ยังเจ็บ'],
c:['งานสร้างสรรค์ โอกาสที่มาจากความรู้สึก','ใช้อารมณ์ตัดสินงานเกินไป'],
f:['ข่าวดีเล็ก ๆ ด้านการเงิน','ใช้เงินตามอารมณ์ ขาดความรอบคอบ']};
MEANINGS.cups12={ku:['ความโรแมนติก','ข้อเสนอ','อุดมคติ','ตามหัวใจ'],kr:['ผิดคำสัญญา','เจ้าชู้','อารมณ์แปรปรวน'],
u:'อัศวินผู้ติดตามหัวใจเดินทางมาพร้อมข้อเสนอแห่งความรักหรือแรงบันดาลใจ. เปิดรับความโรแมนติกและความฝัน แต่เดินอย่างมีสติ.',
r:'คำหวานอาจไม่ตรงกับการกระทำ หรืออารมณ์ที่ขึ้นลงทำให้ตัดสินใจพลาด. ตรวจสอบความจริงใจก่อนไว้ใจ.',
l:['คนโรแมนติกเข้ามา คำขอหรือคำเชิญ','คำสัญญาลม ๆ แล้ง ๆ หรือความรู้สึกไม่คงที่'],
c:['ข้อเสนองานที่น่าสนใจ ทำตามแพชชัน','ฝันหวานเกินไปจนงานตกหล่น'],
f:['ข้อเสนอที่ดูน่าสนใจ ควรพิจารณาให้ดี','ระวังเสนอที่น่าหลงแต่ไม่มีแก่น']};
MEANINGS.cups13={ku:['ความเห็นอกเห็นใจ','สัญชาตญาณ','ความอ่อนโยน','ความเมตตา'],kr:['อ่อนไหวเกิน','เก็บกด','ดูแลคนอื่นจนลืมตัวเอง'],
u:'ผู้ที่เข้าใจหัวใจคน ใช้ความเมตตาและสัญชาตญาณนำทาง. คุณหรือคนใกล้ตัวคือที่พึ่งทางใจ ดูแลอย่างอ่อนโยนแต่รักษาขอบเขต.',
r:'ความอ่อนไหวเกินไปหรือแบกอารมณ์ของคนอื่นจนเหนื่อย. อาจเก็บความรู้สึกไว้ภายใน ลองดูแลใจตัวเองก่อน.',
l:['คนรักอบอุ่น เข้าใจและห่วงใย','พึ่งพาทางอารมณ์ หรือเก็บความรู้สึกไว้ไม่พูด'],
c:['งานที่ดูแลผู้คน งานบริการหรือการให้คำปรึกษา','เหนื่อยจากการแบกปัญหาคนอื่น'],
f:['ดูแลการเงินด้วยสัญชาตญาณและความระมัดระวัง','ช่วยเหลือคนอื่นด้านเงินจนตัวเองลำบาก']};
MEANINGS.cups14={ku:['วุฒิภาวะทางอารมณ์','ความสงบ','ความเมตตา','การควบคุมใจ'],kr:['ปิดกั้นอารมณ์','บงการทางอารมณ์','เย็นชา'],
u:'ผู้ที่สมดุลระหว่างหัวใจกับเหตุผล ใจเย็น มีเมตตาและให้คำปรึกษาที่ดี. จัดการอารมณ์ได้อย่างผู้ใหญ่และเป็นหลักให้ผู้อื่น.',
r:'การกดอารมณ์หรือการใช้ความรู้สึกบงการผู้อื่นสร้างความห่างเหิน. ถ้าอารมณ์ปะทุ ลองหยุดพักแล้วทบทวนก่อนตอบสนอง.',
l:['คนรักที่สุขุม มั่นคงทางใจ','เย็นชา เก็บอารมณ์ หรือบงการทางความรู้สึก'],
c:['หัวหน้าที่ใจเย็นและเข้าใจคน งานที่ต้องใช้ความละเอียดอ่อน','ใช้อารมณ์ในงานหรือขาดความเป็นกลาง'],
f:['ตัดสินใจเรื่องเงินอย่างสุขุมและเป็นธรรม','ใช้อารมณ์ตัดสินใจ หรือมีความกดดันจากเงิน']};

MEANINGS.wands01={ku:['ประกายใหม่','แรงบันดาลใจ','พลังเริ่มต้น','ศักยภาพ'],kr:['ไฟตก','ล่าช้า','ขาดแรงบันดาลใจ'],
u:'ประกายไฟแห่งไอเดียหรือโอกาสใหม่ปรากฏ พลังงานล้นเปี่ยมให้เริ่มลงมือ. ใช้ความกระตือรือร้นนี้ก่อนที่มันจะจางไป.',
r:'ไอเดียหรือแรงจูงใจยังไม่ติด หรือถูกขัดจังหวะด้วยความล่าช้า. พักเติมพลังและมองหาสิ่งที่ปลุกไฟในใจอีกครั้ง.',

c:['โปรเจกต์ใหม่ โอกาสสร้างสรรค์','ไอเดียล้ม หรือขาดทิศทาง'],
f:['โอกาสหารายได้ใหม่ เริ่มลงทุนเล็ก ๆ','แผนการเงินล่าช้า อย่ารีบ']};
MEANINGS.wands02={ku:['การวางแผน','ตัดสินใจ','มองไกล','อำนาจในมือ'],kr:['กลัวการก้าวออก','แผนไม่ชัด','ติดอยู่ในเขตสบาย'],
u:'คุณถือโลกไว้ในมือ ตอนนี้ต้องเลือกว่าจะอยู่ที่เดิมหรือก้าวออกไปสำรวจ. วางแผนระยะยาวให้ชัดแล้วจะมั่นใจในการเดินต่อ.',

f:['วางแผนการเงินระยะยาว','ยังไม่กล้าตัดสินใจลงทุนหรือเปลี่ยน']};
MEANINGS.wands03={ku:['การขยายตัว','มองไปข้างหน้า','การรอผล','ความร่วมมือ'],kr:['แผนล่าช้า','อุปสรรคที่ไม่คาด','ขาดวิสัยทัศน์'],
u:'ความพยายามที่ผ่านมาเริ่มส่งผล คุณมองเห็นขอบฟ้าใหม่และโอกาสขยายตัว. เรือแห่งความหวังกำลังเดินทางกลับมา อดทนรอและเตรียมรับ.',

c:['งานเติบโต ขยายธุรกิจ ตลาดต่างประเทศ','งานล่าช้า หรือการขยายยังไม่พร้อม'],

MEANINGS.wands04={ku:['การเฉลิมฉลอง','ความมั่นคง','บ้าน','ความสำเร็จเป็นขั้น'],kr:['ความไม่ลงตัว','ความไม่มั่นคงในบ้าน','เลื่อนฉลอง'],
u:'ถึงจุดที่ควรฉลองความสำเร็จเล็ก ๆ และความมั่นคงที่สร้างมา. เป็นช่วงรื่นเริงกับคนรัก ครอบครัวหรือทีมงาน.',

MEANINGS.wands05={ku:['การแข่งขัน','ความขัดแย้ง','การท้าทาย','ความหลากหลายของความคิด'],kr:['หลีกเลี่ยงความขัดแย้ง','ข้อพิพาทสงบ','การแข่งขันที่ไม่เป็นธรรม'],
u:'หลายฝ่ายมีความเห็นและพลังที่ต่างกัน ทำให้เกิดการเถียงหรือแข่งขัน. ถ้าจัดการดีจะเป็นแรงผลักให้ไอเดียแข็งแรง.',

l:['เถียงกันบ่อย ความเห็นไม่ตรงกัน แต่ยังพัฒนาได้','เก็บความขัดแย้งไว้ หรือกำลังปรับความเข้าใจ'],
c:['แข่งขันในที่ทำงาน ความเห็นไม่ลงรอยในทีม','ความตึงเครียดลดลง เริ่มร่วมมือ'],
f:['การแข่งขันด้านการตลาดหรือรายได้','ข้อพิพาทเรื่องเงินคลี่คลาย']};
MEANINGS.wands06={ku:['ชัยชนะ','การยอมรับ','ความภาคภูมิใจ','ความเป็นผู้นำ'],kr:['ล้มเหลว','ขาดการยอมรับ','ตกจากหิ้ง'],

c:['ย้ายงานหรือเดินทางเพื่อสิ่งที่ดีกว่า','ติดอยู่กับปัญหาเดิม การเปลี่ยนล่าช้า'],

MEANINGS.swords07={ku:['กลยุทธ์','การหลบเลี่ยง','ความลับ','ฉลาดแกมโกง'],kr:['ถูกจับได้','สารภาพ','เปลี่ยนแผน'],

r:'ความลับหรือเล่ห์เหลี่ยมถูกเปิดเผย หรือคุณอยากสารภาพและเลิกซ่อน. ซื่อตรงต่อตัวเองจะเบากว่า.',

c:['วางกลยุทธ์ชาญฉลาด แต่ระวังเล่ห์เหลี่ยมคนอื่น','ถูกจับได้ หรือเปลี่ยนมาเล่นอย่างเปิดเผย'],

MEANINGS.swords08={ku:['ความรู้สึกติดกับ','ข้อจำกัดที่คิดเอง','ความกลัว','ถูกกดดัน'],kr:['หลุดพ้น','มองเห็นทางออก','ปลดผ้าปิดตา'],

MEANINGS.swords09={ku:['ความกังวล','ฝันร้าย','ความกลัวที่คิดไปเอง','นอนไม่หลับ'],kr:['ความกังวลคลาย','ขอความช่วยเหลือ','เผชิญความจริง'],

l:['ความหวาดระแวงในความสัมพันธ์ กังวลเกินจริง','เริ่มสบายใจขึ้น พูดคุยแก้ปัญหา'],

MEANINGS.swords10={ku:['การสิ้นสุดอย่างเจ็บปวด','ถึงก้นบึ้ง','ทรยศ','จบเพื่อเริ่มใหม่'],kr:['ฟื้นตัว','เลวร้ายที่สุดผ่านไป','ยื้อความเจ็บ'],

MEANINGS.swords11={ku:['ความอยากรู้','คำพูดตรง','ไอเดียใหม่','ความตื่นตัวทางความคิด'],kr:['พูดไม่ยั้ง','ซุบซิบ','ขาดความรอบคอบ'],

MEANINGS.swords12={ku:['การลุยเต็มกำลัง','ความมุ่งมั่น','เด็ดขาด','ใช้เหตุผล'],kr:['หุนหัน','ก้าวร้าว','ขาดการยั้งคิด'],

MEANINGS.swords13={ku:['ความซื่อตรง','ความเฉียบคม','ประสบการณ์','ความอิสระทางความคิด'],kr:['เย็นชา','ขมขื่น','ใช้คำพูดทำร้าย'],

MEANINGS.swords14={ku:['ปัญญา','อำนาจทางความคิด','ความยุติธรรม','การตัดสินที่ชัด'],kr:['ใช้อำนาจในทางผิด','เย็นชา','ตัดสินไม่เป็นธรรม'],

MEANINGS.pentacles01={ku:['โอกาสทางวัตถุ','ความมั่งคั่งใหม่','รากฐาน','ความเป็นจริง'],kr:['โอกาสหลุดมือ','วางแผนผิด','ความโลภ'],
u:'โอกาสด้านการงาน การเงิน หรือความมั่นคงกำลังมาถึงในรูปที่จับต้องได้. ลงมือปลูกเมล็ดพันธุ์นี้ด้วยความตั้งใจแล้วจะงอกงาม.',
r:'โอกาสถูกมองข้ามหรือแผนการเงินผิดพลาดทำให้เสียของ. ตรวจสอบรายละเอียดและอย่าให้ความโลภนำทาง.',

MEANINGS.pentacles02={ku:['การสมดุล','การปรับตัว','จัดสรรเวลา','ความยืดหยุ่น'],kr:['ล้นมือ','เสียสมดุล','จัดการไม่ไหว'],

MEANINGS.pentacles03={ku:['การทำงานเป็นทีม','ฝีมือ','การเรียนรู้','ความร่วมมือ'],kr:['ขาดความร่วมมือ','งานสะเพร่า','ไม่ได้รับการยอมรับ'],
u:'ความสำเร็จเกิดจากฝีมือและการร่วมมือกันของคนที่มีความเชี่ยวชาญ. ลงทุนกับการเรียนรู้และรับฟังความเห็นผู้อื่นเพื่อผลงานที่ดี.',

MEANINGS.pentacles04={ku:['ความมั่นคง','การเก็บออม','การควบคุม','ความปลอดภัย'],kr:['ตระหนี่เกินไป','ปล่อยวาง','ยึดติดทรัพย์'],

const D2R = Math.PI/180;

  return p.join(' ');
}
function pentagram(cx,cy,r,rot=-90){
  const v=[0,1,2,3,4].map(i=>[cx+r*Math.cos((rot+i*72)*D2R),cy+r*Math.sin((rot+i*72)*D2R)]);

}

  flip(){if(!this.on)return;this.click(0,.2,1800,.12);this.click(.55,.14,3600,.09)},
  chime(){

/* ======================================================================

function getMeaning(card){

/* Spread summary: 3–4 coherent sentences from keywords + positions + suit/Major patterns */

  else if(revN===0)adv='ไพ่ทุกใบตั้งตรง พลังจึงไหลได้ดี เชื่อมั่นในสัญชาตญาณแล้วลงมือตามที่ใจเห็นชอบได้';
  else if(revN>=Math.ceil(n/2))adv=`ไพ่กลับหัวมีถึง ${revN} จาก ${n} ใบ ควรชะลอและทบทวนสิ่งที่ติดขัดภายในก่อนตัดสินใจเรื่องใหญ่`;
  else adv=`มีไพ่กลับหัว ${revN} ใบ เป็นจุดที่ควรใส่ใจเป็นพิเศษ ส่วนไพ่ที่เหลือเป็นแรงหนุนให้ก้าวต่อไปได้`;
  if(n>1&&courts>=2)adv+=` นอกจากนี้ไพ่ราชสำนัก ${courts} ใบบ่งว่ามีผู้คนหรือบทบาทสำคัญหลายคนเข้ามาเกี่ยวข้อง`;
  out.push(adv);return out;
}
function summaryHTML(){
  const cs=S.picked,majors=cs.filter(c=>c.arcana==='major').length,revN=cs.filter(c=>c.reversed).length;
  const cnt={};cs.forEach(c=>{if(c.suit)cnt[c.suit]=(cnt[c.suit]||0)+1});

/* ======================================================================
   SECTION 6 · 3D LAYOUT ENGINE — every pose {x,y,z,rotation,rotationX,rotationY,scale}
   for every state comes from here (relative to the viewport centre, table plane z=0)
   ====================================================================== */
const TILT ={intro:0,gather:30,setup:30,shuffle:36,pick:0,reveal:0,reading:0,gallery:0};
const DOLLY={shuffle:90};
const PARAMP={pick:0,reveal:.45,reading:.45,gallery:.2};   // pick: camera holds still so the card under the pointer never drifts
const INFO_W=()=>Math.min(400,innerWidth*.36),INFO_H=()=>Math.min(innerHeight*.46,400);   // gallery info panel
function computeLayout(){
  const W=innerWidth,H=innerHeight,wide=W>=900&&W/H>=1.15;
  const cw=clamp(Math.min(H*.17,W*.26),58,118),ch=cw*12/7,row=W<720;
  const L={W,H,wide,row,cw,ch,hdr:56,corner:.4};
  L.px=Math.round(clamp(Math.min(H*.36,W*.42),cw,300));        // layout width of card art (largest size a card is shown at)
  L.dockW=Math.min(400,W*.36);L.dockH=Math.min(H*(S.spreadKey==='celtic'?.34:.4),340);
  // setup deck: centred in the space between the header and the deck hint above the setup panel,
  // shrunk when that space is short (phones with browser bars). The camera is tilted 30° here, so a
  // screen offset maps to world y / cos30.
  const sp=document.getElementById('setup'),pH=sp?sp.offsetHeight:380,y0=56+8,y1=H-pH-14-44,deckH=ch*.87+22;
  L.deckSetup={x:0,y:((y0+y1)/2-H/2)/.866,sc:clamp((y1-y0-8)/deckH,.5,1)};L.hintTop=y1-2;
  L.deckRoom=Math.max(0,((y1-y0)-deckH*L.deckSetup.sc)/2);          // free screen space above the deck
  L.deckShuffle={x:0,y:-H*.03};
  L.Hf=row?ch+80:Math.min(H*.42,420);L.step=clamp(cw*.36,24,40);
  return L;
}
const TH=.45;                                                   // deck thickness per card (px of z)
const stackPose=(i,b,sc=b.sc||1)=>pose({x:b.x,y:b.y,z:i*TH*sc,scale:sc});
function cornerPose(k){
  const L=S.L,sc=L.corner,ext=!L.wide?(S.dock==='open'?L.dockH:S.dock==='peek'?44:0):0;
  return pose({x:-L.W/2+16+L.cw*sc/2,y:L.H/2-ext-16-L.ch*sc/2,z:k*.3,scale:sc});
}
function offPose(c){const L=S.L,R=Math.hypot(L.W,L.H)*.7;return pose({x:Math.cos(c.a0)*R,y:Math.sin(c.a0)*R,z:c.zf,rotation:c.a0/D2R+90,rotationX:c.rx0,rotationY:c.ry0})}
function maxPan(n){const L=S.L;return Math.max(0,((n-1)*L.step)/2-(L.W/2-L.cw/2-14))}
/* Pick layouts: each deal picks one at random (never the same twice in a row).
   wide screens: arc · wave · twin (two tiers) · scatter (cards strewn on the table)
   phones (a pannable row): arc · wave · scatter
   twin and scatter keep per-card data set at deal time (c.tier, c.fs), so when a card is taken
   the others stay where they lie instead of every later card shifting along. */
const FAN_WIDE=['arc','wave','twin','scatter'],FAN_ROW=['arc','wave','scatter'];
function pickFanKind(){
  const list=S.L.row?FAN_ROW:FAN_WIDE,opts=list.filter(k=>k!==S.fanKind);
  S.fanKind=opts[Math.floor(Math.random()*opts.length)];
  const n=S.fan.length,cols=Math.ceil(n/3),R=Math.random;
  S.fan.forEach((c,i)=>{
    c.tier=i%2;
    const col=Math.floor(i/3),row=i%3;
    c.fs={u:(col+.5+(R()-.5)*.9)/cols,v:(row+.15+R()*.7)/3,r:(R()*2-1)*26,j:R()*2-1};
  });
}
function arcAt(t,Rx,Ry,top){return{x:Rx*Math.sin(t),y:top+Ry*(1-Math.cos(t)),rotation:Math.atan2(Ry*Math.sin(t),Rx*Math.cos(t))/D2R}}
function fanPose(i,n){
  const L=S.L,ch=L.ch,kind=S.fanKind||'arc',c=S.fan[i];
  // only the plain arc tilts back (rotationX): neighbours in the other layouts differ a lot in rotation,
  // and tilted planes at nearly the same depth cut through one another
  if(L.row){
    const half=L.W/2,x=(i-(n-1)/2)*L.step-S.pan,u=x/half,topY=L.H-L.Hf+50+ch/2-L.H/2;
    if(kind==='wave'){const a=14,w=.42;return pose({x,y:topY+a+a*Math.sin(i*w),z:i*1.2,rotation:Math.atan(a*w*Math.cos(i*w)/L.step)/D2R*.5})}
    if(kind==='scatter'&&c&&c.fs){const j=c.fs.j;return pose({x,y:topY+10+j*12,z:i*1.2,rotation:j*9})}
    const k=26;return pose({x,y:topY+k*u*u,z:i*1.2,rotation:Math.atan(2*k*u/half)/D2R});
  }
  const Hf=L.Hf,Rx=Math.max(160,Math.min(L.W*.5-ch*.55-10,720)),top=L.H-Hf+30+ch/2-L.H/2;
  if(kind==='wave'){
    const s=n>1?i/(n-1):.5,a=clamp((Hf-30-ch)/2.2,12,46),ph=s*Math.PI*4;
    return pose({x:Rx*(2*s-1),y:top+a+a*Math.sin(ph),z:i*1.2,rotation:Math.atan(a*4*Math.PI*Math.cos(ph)/(2*Rx))/D2R});
  }
  if(kind==='twin'&&c&&c.tier!==undefined){
    let r=0,m=0;S.fan.forEach((d,k)=>{if(d.tier===c.tier){if(k<i)r++;m++}});
    const back=c.tier===0,A=back?52:62,span=Math.max(1,m-1),t=(r-span/2)*(2*A/Math.max(span,40))*D2R;
    const Ry=ch*(back?.62:.5);

    return pose({...p,z:(back?0:120)+r*1.2});
  }
  if(kind==='scatter'&&c&&c.fs){
    const f=c.fs,y0=top,y1=Math.max(y0,L.H/2-ch*.5-10);              // the lowest row stays fully on screen
    return pose({x:Rx*(2*f.u-1),y:y0+(y1-y0)*f.v,z:i*1.2,rotation:f.r});
  }
  const A=70,Ry=Math.max(50,(Hf-34-1.1*ch)/(1-Math.cos(A*D2R)));
  return pose({...arcAt((i-(n-1)/2)*(2*A/77)*D2R,Rx,Ry,top),z:i*1.2,rotationX:6});
}
function revealBox(){
  const L=S.L,open=S.dock==='open',peek=S.dock==='peek',extra=S.summary?52:0;
  let x1=L.W,y1=L.H-96+extra,y0=L.hdr+(S.summary?-6:4);
  if(L.wide&&open)x1=L.W-L.dockW-10;
  if(!L.wide){const ext=open?L.dockH:peek?44:0;y1=L.H-ext-90+extra*(open?.4:1)}
  return{x0:0,x1,y0,y1};
}
const pickBox=()=>({x0:0,x1:S.L.W,y0:S.L.hdr+48,y1:S.L.H-S.L.Hf-8});
const boxFor=st=>(st==='reveal'||st==='reading')?revealBox():pickBox();
function spreadPoses(box){
  const pos=SPREADS[S.spreadKey].pos,L=S.L,LBL=.42,pad=10;
  let X0=1e9,X1=-1e9,Y0=1e9,Y1=-1e9;
  pos.forEach(p=>{const hw=p.rot?6/7:.5,hh=p.rot?.5:6/7;X0=Math.min(X0,p.x-hw);X1=Math.max(X1,p.x+hw);Y0=Math.min(Y0,p.y-hh);Y1=Math.max(Y1,p.y+hh+(p.nolbl?0:LBL))});
  const bw=box.x1-box.x0,bh=box.y1-box.y0;
  const cw=Math.max(30,Math.min((bw-2*pad)/(X1-X0),(bh-2*pad)/(Y1-Y0),S.spreadKey==='one'?300:250)),sc=cw/L.cw;
  const ox=box.x0+(bw-cw*(X1-X0))/2-cw*X0,oy=box.y0+(bh-cw*(Y1-Y0))/2-cw*Y0;
  return pos.map((p,i)=>{const cx=ox+p.x*cw,cy=oy+p.y*cw;
    return {...pose({x:cx-L.W/2,y:cy-L.H/2,z:2+i*.6,scale:sc,rotation:p.rot||0}),lx:cx-L.W/2,ly:cy-L.H/2+cw*12/7/2+13}});
}
const slotPoses=st=>spreadPoses(boxFor(st));
function poseOf(c,st){
  if(st==='intro')return offPose(c);
  if(st==='gallery')return galleryPose(c);
  if(st==='setup'||st==='gather')return stackPose(c.idx,S.L.deckSetup);
  if(st==='shuffle')return stackPose(c.idx,S.L.deckShuffle);
  if(c.placed)return slotPoses(st)[S.picked.indexOf(c)];
  if(st==='pick'){const i=S.fan.indexOf(c);return i<0?stackPose(c.idx,S.L.deckShuffle):fanPose(i,S.fan.length)}
  return cornerPose(S.rest.indexOf(c));
}
function applyPoses(animate=false,dur=.9,st=S.state,only=null){
  const sp=(st==='pick'||st==='reveal'||st==='reading')?slotPoses(st):null;
  S.deck.forEach(c=>{
    if(only&&!only(c))return;
    const p=(c.placed&&sp)?sp[S.picked.indexOf(c)]:poseOf(c,st);if(!p)return;
    const {lx,ly,...q}=p;
    if(st!=='intro')gsap.set(c.el,{autoAlpha:1});
    if(animate&&!RM())gsap.to(c.el,{...q,duration:dur,ease:EIO,overwrite:'auto'});else gsap.set(c.el,q);
  });
}

/* ---- camera: tilt + dolly per state, pointer parallax, idle sway ---- */
/* altar: a velvet cloth with a slowly turning sigil lying on the 3D table plane, under wherever the cards are */
function altarSize(){
  const L=S.L,w=Math.max(L.W,L.H)*1.05,h=w*.64,sig=Math.min(L.W,L.H)*(L.wide?.62:.78);
  gsap.set('#altar',{width:w,height:h,xPercent:-50,yPercent:-50});ROOTSTYLE.setProperty('--sig',sig+'px');
}
function altarTo(st,dur=1.8){

  else if(st==='shuffle'||st==='pick')y=L.deckShuffle.y;

function camTo(st,dur=1.8){PAR.amp=PARAMP[st]??1;altarTo(st,dur);

  if(S.sway){if(st==='pick'){S.sway.pause();gsap.to('#bob',{y:0,rotationY:0,rotationZ:0,duration:.8,ease:EO})}else if(S.sway.paused())S.sway.play()}
  return gsap.to('#cam',{rotationX:TILT[st]??0,z:DOLLY[st]||0,duration:RM()?.01:dur,ease:BIG,overwrite:'auto'})}

const qBX=gsap.quickTo('#bgimg','x',{duration:2.2,ease:EO}),qBY=gsap.quickTo('#bgimg','y',{duration:2.2,ease:EO});   // backdrop drifts opposite the pointer
addEventListener('pointermove',e=>{

/* Fan hit-testing is geometric, not DOM-based: in 3D the browser's hit-test follows depth
   sorting and the lifted card's raised box, so the card under the pointer was not always the
   one that reacted. Here every card's projected rect is tested and the top-most (highest index) wins. */
const PERSP=1700;
function hitFan(cx,cy){
  const L=S.L,n=S.fan.length,oy=L.H*(.46-.5),px=cx-L.W/2,py=cy-L.H/2;
  // test the nearest card first: in the twin layout the front tier is not the higher index
  const order=S.fan.map((c,i)=>({c,i,p:fanPose(i,n)})).sort((a,b)=>b.p.z-a.p.z||b.i-a.i);
  for(const {c,p} of order){
    const f=PERSP/(PERSP-p.z),X=p.x*f,Y=oy+(p.y-oy)*f,th=p.rotation*D2R;
    const dx=(px-X)/f,dy=(py-Y)/f,lx=dx*Math.cos(th)+dy*Math.sin(th),ly=-dx*Math.sin(th)+dy*Math.cos(th);
    const top=(c===S.hover||c===S.armed)?-L.ch/2-46:-L.ch/2;          // a lifted card keeps its raised top edge
    if(Math.abs(lx)<=L.cw/2&&ly>=top&&ly<=L.ch/2)return{c,u:lx/L.cw};
  }

}

/* ======================================================================
   SECTION 8 · STATE MACHINE
   intro → gather → setup → shuffle → pick → reveal → reading → (gather → setup)
   `go()` ignores input while a transition runs. One function per phase transition;
   every next entrance is scheduled before the previous exit ends.
   ====================================================================== */
const setState=s=>{S.state=s;$('#stage').dataset.state=s};
async function go(fn){
  if(S.busy)return;S.busy=true;
  try{await fn()}finally{S.busy=false;if(S.pendingResize){S.pendingResize=false;onResize(true)}}
}
function fisherYates(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setPrompt(main,sub){
  if(main!==null){const p=$('#promptMain');if(p.textContent!==main){if(RM())p.textContent=main;
    else gsap.timeline().to(p,{y:-8,autoAlpha:0,duration:.18,ease:EI}).add(()=>{p.textContent=main}).to(p,{y:0,autoAlpha:1,duration:.3,ease:EO});}}
  if(sub!==null&&sub!==undefined)$('#promptSub').textContent=sub;
}
/* 3D flight: quadratic bezier in x/y/z with spin, tilt and scale blend */
function flyTo(c,tp,{dur=1.05,lift=420,spin=26,side=1,rise=200,ease=EIO}={}){
  const fr=readPose(c.el),o={t:0},cx=(fr.x+tp.x)/2+side*90,cy=Math.min(fr.y,tp.y)-rise,cz=Math.max(fr.z,tp.z)+lift;
  return gsap.to(o,{t:1,duration:RM()?.01:dur,ease,onUpdate(){
    const t=o.t,u=1-t,s=Math.sin(Math.PI*t);
    gsap.set(c.el,{x:u*u*fr.x+2*u*t*cx+t*t*tp.x,y:u*u*fr.y+2*u*t*cy+t*t*tp.y,z:u*u*fr.z+2*u*t*cz+t*t*tp.z,
      rotation:fr.rotation+(tp.rotation-fr.rotation)*t+spin*side*s,rotationX:fr.rotationX+(tp.rotationX-fr.rotationX)*t-26*s,
      rotationY:fr.rotationY+(tp.rotationY-fr.rotationY)*t+14*side*s,scale:fr.scale+(tp.scale-fr.scale)*t});
  }});
}
/* tornado: polar angle + shrinking radius around the deck, with depth lift and tumble */
function vortexTL(cards,{target,dur=2.2,gap=.008,spin=1,lift=0}){
  const tl=gsap.timeline(),D=S.L.deckSetup,rm=RM();
  cards.forEach((c,i)=>{
    const tp=target(c,i);
    if(rm){tl.set(c.el,{autoAlpha:0},0).set(c.el,tp,0).to(c.el,{autoAlpha:1,duration:.4,ease:EO},.05+i*.002);return}
    const fr=readPose(c.el),dx=fr.x-D.x,dy=fr.y-D.y,a0=Math.atan2(dy,dx),r0=Math.hypot(dx,dy);
    const turn=(1.15+Math.random()*.55)*Math.PI*spin,o={t:0},swirl=rand(140,240)*spin,wob=rand(-35,35),wy=rand(-30,30);
    tl.set(c.el,{autoAlpha:1},i*gap).to(o,{t:1,duration:dur,ease:'back.out(1.05)',onUpdate(){
      const e=o.t,em=Math.min(e,1),s=Math.sin(Math.PI*em),r=r0*(1-e),a=a0+turn*e;
      gsap.set(c.el,{x:D.x+Math.cos(a)*r+(tp.x-D.x)*e,y:D.y+Math.sin(a)*r+(tp.y-D.y)*e,z:Math.max(fr.z+(tp.z-fr.z)*e+lift*s,S.L.ch*.6*s),
        rotation:fr.rotation+(tp.rotation-fr.rotation)*e+swirl*s*.6,rotationX:fr.rotationX+(tp.rotationX-fr.rotationX)*em+wob*s,
        rotationY:fr.rotationY+(tp.rotationY-fr.rotationY)*em+wy*s,scale:fr.scale+(tp.scale-fr.scale)*em});
    }},i*gap);
  });

}
/* ---- camera-space flights: paths are planned in the camera's own frame (x right, y down, z toward the
   viewer) and mapped back into the world every frame with the camera's live tilt and dolly, so a card can
   come from a screen edge or from right in front of the viewer while the camera is still moving ---- */
const camNow=()=>({a:(+gsap.getProperty('#cam','rotationX')||0)*D2R,z:+gsap.getProperty('#cam','z')||0});
const toCam=(p,k)=>{const c=Math.cos(k.a),s=Math.sin(k.a);return{x:p.x,y:p.y*c-p.z*s,z:p.y*s+p.z*c+k.z}};
const toWorld=(p,k)=>{const c=Math.cos(k.a),s=Math.sin(k.a),Z=p.z-k.z;return{x:p.x,y:p.y*c+Z*s,z:-p.y*s+Z*c}};
// a point that shows at screen offset (sx,sy) from the viewport centre, at camera depth z
function atScreen(sx,sy,z){const oy=-.04*S.L.H,f=(PERSP-z)/PERSP;return{x:sx*f,y:oy+(sy-oy)*f,z}}
/* fr: camera-space start {x,y,z} plus rotation/rotationX/rotationY (rotationX relative to facing the
   viewer). tp: world target pose, or null to hold at fr. add(t,s) returns camera-space and rotation offsets. */
function camFly(c,fr,tp,{dur,ease='power2.inOut',add,fade=0}){
  const o={t:0},R0=fr.rotation||0,RX=fr.rotationX||0,RY=fr.rotationY||0,sc=fr.scale??(tp?tp.scale:1);
  return gsap.to(o,{t:1,duration:dur,ease,onStart(){gsap.set(c.el,{autoAlpha:fade?0:1});fade&&gsap.to(c.el,{autoAlpha:1,duration:fade,ease:'none'})},onUpdate(){
    const t=o.t,k=camNow(),face=-k.a/D2R,s=Math.sin(Math.PI*Math.min(Math.max(t,0),1)),q=tp?toCam(tp,k):fr,d=add?add(t,s):{};
    const w=toWorld({x:fr.x+(q.x-fr.x)*t+(d.x||0),y:fr.y+(q.y-fr.y)*t+(d.y||0),z:fr.z+(q.z-fr.z)*t+(d.z||0)},k);
    w.z=Math.max(w.z,S.L.ch*.6*s);                       // never dip under the altar cloth (z -8), which would hide the card
    const T=tp||{rotation:R0,rotationX:face+RX,rotationY:RY,scale:sc};
    gsap.set(c.el,{...w,rotation:R0+(T.rotation-R0)*t+(d.rotation||0),rotationX:face+RX+(T.rotationX-face-RX)*t+(d.rotationX||0),
      rotationY:RY+(T.rotationY-RY)*t+(d.rotationY||0),scale:sc+(T.scale-sc)*t});
  }});
}
/* Opening gathers: one is picked at random each time the deck forms after "เริ่ม". Every kind lands the
   cards bottom-first (arrival time rises with the stack index), so no card sinks through those above it. */
const GATHERS={
  // the original tornado around the deck
  vortex:(cards,target)=>vortexTL(cards,{target,dur:2.3}),
  // from every edge of the screen, and a few straight out from behind the viewer into the deck
  storm(cards,target){
    const tl=gsap.timeline(),L=S.L,n=cards.length,front=new Set(fisherYates([...Array(n).keys()]).slice(0,L.wide?11:7));
    let fk=0;
    cards.forEach((c,i)=>{
      const tp=target(c,i),T=1.4+i*.016;
      if(front.has(i)){
        const dur=1.15,fr={...atScreen(rand(-.16,.16)*L.W,rand(-.12,.12)*L.H,rand(1400,1480)),rotation:rand(-30,30),rotationX:rand(-14,14),rotationY:rand(-14,14)};
        const at=Math.max(.05,T-dur);
        if(fk++%3===0)tl.add(()=>Sound.whoosh(),at);
        tl.add(camFly(c,fr,tp,{dur,ease:'power3.out',fade:.12,add:(t,s)=>({rotation:s*40})}),at);
      }else{
        const th=rand(0,TAU),m=L.ch*1.1,cx=Math.cos(th),cy=Math.sin(th),k=1/Math.max(Math.abs(cx)/(L.W/2+m),Math.abs(cy)/(L.H/2+m));
        const dur=rand(1,1.35),fr={...atScreen(cx*k,cy*k,rand(-350,450)),rotation:rand(-180,180),rotationX:rand(-50,50),rotationY:rand(-50,50)};
        const bend=rand(-.35,.35)*Math.min(L.W,L.H),nx=-cy,ny=cx;
        tl.add(camFly(c,fr,tp,{dur,ease:'power2.inOut',add:(t,s)=>({x:nx*bend*s,y:ny*bend*s,z:120*s,rotationX:-30*s})}),Math.max(0,T-dur));
      }
    });
    return tl;
  },
  // fluttering down from above the screen like falling leaves
  rain(cards,target){
    const tl=gsap.timeline(),L=S.L;
    cards.forEach((c,i)=>{
      const tp=target(c,i),dur=rand(1.15,1.5),ph=rand(0,TAU),amp=rand(40,110),T=1.55+i*.016;
      const fr={...atScreen(rand(-.55,.55)*L.W,-L.H/2-L.ch*rand(.8,2.6),rand(-250,550)),rotation:rand(-60,60),rotationX:rand(-35,35),rotationY:rand(-70,70)};
      tl.add(camFly(c,fr,tp,{dur,ease:'sine.inOut',add:(t,s)=>{const w=Math.sin(t*TAU*1.4+ph)*(1-t);
        return{x:amp*w+fr.x*(t-t*t*t),rotation:18*w,rotationY:40*w,rotationX:-25*s}}}),Math.max(0,T-dur));   // keep falling wide, slide in late
    });
    return tl;
  },
  // one long ribbon of cards streams in from far away and coils down into the deck
  stream(cards,target){
    const tl=gsap.timeline(),L=S.L,dur=1.3,gap=.021,side=Math.random()<.5?-1:1,A=Math.min(L.W*.32,420);
    const fr0=atScreen(-side*L.W*.3,-L.H*.15,-2600);
    cards.forEach((c,i)=>{
      const tp=target(c,i),fr={...fr0,rotation:side*180,rotationX:-30,rotationY:0};
      tl.add(camFly(c,fr,tp,{dur,ease:'sine.inOut',add:(t,s)=>{const f=Math.pow(1-t,.6),w=Math.sin(t*TAU*1.05);
        return{x:side*A*1.3*w*f,y:-L.H*.12*Math.sin(t*Math.PI*1.6)*f,z:950*s*s,rotationY:side*40*w*f}}}),.05+i*gap);
    });
    return tl;
  },
  // the deck first hangs as a wall of cards facing the viewer, then folds in from the outside to the centre
  wall(cards,target){
    const tl=gsap.timeline(),L=S.L,n=cards.length,cw=L.cw,ch=L.ch;
    const cols=Math.max(4,Math.round(Math.sqrt(n*(L.W/L.H)*(ch/cw)*.95))),rows=Math.ceil(n/cols);

/* ---- PHASE 3 · setup: choosing a spread lifts that many cards off the deck as a 3D preview ---- */
S.previews=[];
S.prevCards=[];
function killPreview(){S.previews.forEach(t=>t.kill());S.previews=[]}
function previewSpread(){
  if(S.state==='shuffle')return;
  const n=SPREADS[S.spreadKey].count,D=S.L.deckSetup,top=S.deck.slice(-n),cw=S.L.cw;
  killPreview();
  // cards lifted by the previous preview but not by this one must glide back onto the deck,
  // otherwise a spread switched mid-preview (10 → 1) leaves them hanging in the air
  S.prevCards.filter(c=>!top.includes(c)).forEach(c=>gsap.to(c.el,{...stackPose(c.idx,D),duration:RM()?.01:.5,ease:EIO,overwrite:'auto'}));
  S.prevCards=top;
  if(RM()){top.forEach(c=>gsap.set(c.el,stackPose(c.idx,D)));return}
  // drawn from the deck: the cards first rise off the top of the pile, then fan out; on the way back they
  // fold into a neat pile right above the deck and settle down onto it, so the motion always reads as one deck
  const topZ=(S.deck.length-1)*TH*(D.sc||1);
  // 1 card: lifted clear above the deck (as far as the free space allows) · 3 cards: side by side with gaps ·
  // 10 cards: an overlapping fan
  // lifts never go past the free space above the deck (minus a margin), so cards stay clear of the header
  const sc=D.sc||1,cwS=cw*sc,chS=cwS*12/7,room=Math.max(0,S.L.deckRoom-18)/.866,
    lift1=Math.min(chS*.6,room),lift3=Math.min(chS*.22,room),gap3=Math.min(cwS*1.14,(S.L.W-24)/3/.95),
    narrow=S.L.W<600,step10=Math.min(cw*.34,(S.L.W-36-cwS*1.4)/9/.95);   // the 10-card fan fits the screen width
  // a card tilted by rotationX dips its lower edge by (half height)·sin(tilt); lift it at least that much above the
  // deck top, or the edge sinks into the pile
  const clear=rx=>chS*.5*Math.sin(Math.abs(rx)*D2R)+10,rx10=narrow?-6:-12;
  top.forEach((c,k)=>{
    const off=(k-(n-1)/2),i=c.idx,pile={x:D.x,y:D.y-cw*.06,z:topZ+10+k*1.5,rotation:0,rotationX:0,rotationY:0};
    const fan=n===1?{x:D.x,y:D.y-lift1,z:topZ+clear(14),rotation:-3,rotationX:-14}
      :n<=3?{x:D.x+off*gap3,y:D.y-lift3+Math.abs(off)*chS*.04,z:topZ+clear(12)+k*12,rotation:off*4,rotationX:-12}
      :{x:D.x+off*step10,y:D.y-Math.min(cw*.18,room)+(narrow?off*off*cwS*.035:0),z:topZ+clear(rx10)+k*(narrow?9:16),rotation:off*(narrow?3:5),rotationX:rx10};
    S.previews.push(gsap.timeline({delay:k*.035})
      .to(c.el,{...pile,duration:.22,ease:'power2.out',overwrite:'auto'})
      .to(c.el,{...fan,duration:.55,ease:'power3.out'})
      .to(c.el,{...pile,duration:.45,ease:'power2.inOut'},'+=.55')
      .to(c.el,{...stackPose(i,D),duration:.3,ease:'power2.in'}));
  });
}

/* ---- PHASE 4 · shuffle (all 3D: halves bend, packets arc, piles split in depth) ---- */
function shuffleOnce(kind){

      .to(B,{x:D.x+spread*.62,z:i=>sz(i)+30,rotation:i=>4+i/h*5,rotationY:-28,duration:.5,ease:EO},0)
      .to(A,{rotationX:-14,duration:.25,ease:EO},.35).to(B,{rotationX:-14,duration:.25,ease:EO},.35);
    mix.forEach((el,k)=>tl.to(el,{x:D.x,z:sz(k)+8,rotation:0,rotationX:0,rotationY:0,duration:.24,ease:EI},.62+k*.009));

  }else if(kind==='overhand'){

    while(left>0){const s=Math.min(left,Math.round(rand(10,16)));sizes.push(s);left-=s}
    sizes.forEach((s,pi)=>{const pk=els.slice(from,from+s);from+=s;
      tl.to(pk,{x:D.x-spread*.95,y:D.y-30,z:i=>sz(n)+120+i*TH,rotation:-10,rotationX:-24,rotationY:12,duration:.2,ease:EO},t)
        .to(pk,{x:D.x,y:D.y,z:i=>sz(n+pi*s+i),rotation:0,rotationX:0,rotationY:0,duration:.2,ease:EI},t+.21);
      t+=.25});

    const orders=[[2,0,1],[1,2,0],[2,1,0],[1,0,2]],ord=orders[Math.floor(Math.random()*orders.length)];
    tl.to(Pl[0],{x:D.x-spread*1.3,z:i=>sz(i),rotation:-5,rotationY:16,duration:.5,ease:EO},0)
      .to(Pl[1],{z:i=>sz(i)+140,rotationX:-18,duration:.5,ease:EO},0)
      .to(Pl[2],{x:D.x+spread*1.3,z:i=>sz(i),rotation:5,rotationY:-16,duration:.5,ease:EO},0);
    let base=0,t=.72;
    ord.forEach(pi=>{const p=Pl[pi],b0=base;
      tl.to(p,{x:D.x,z:i=>sz(b0+i)+90,duration:.2,ease:EO},t).to(p,{z:i=>sz(b0+i),rotation:0,rotationX:0,rotationY:0,duration:.18,ease:EI},t+.2);
      base+=p.length;t+=.3});

/* ---- PHASE 8 · new reading, staged so every step reads:
   (B) opened cards rise and slowly turn face-down, releasing gold motes →
   (C) camera tilts back; corner deck + spread gather into one floating stack →
   (D) the stack bursts into a turning ring of all 78 cards, which collapses into the deck → setup rises ---- */
/* Formations for the new-reading burst, one picked at random each time (never twice in a row).
   Each maps card i of n, the spin s and its tier o (i%2) to a point in unit space; the card is
   turned along the curve (tangent taken numerically) and the whole shape grows with g.r. */
const RING_FORMS={
  ring:  (i,n,s)=>{const t=i/n*TAU+s;return[Math.cos(t),Math.sin(t)]},
  spiral:(i,n,s)=>{const t=i/n*TAU*2.3+s,r=.26+.74*i/n;return[r*Math.cos(t),r*Math.sin(t)]},
  twin:  (i,n,s,o)=>{const t=i/n*TAU+(o?s:-s*1.25),r=o?1:.56;return[r*Math.cos(t),r*Math.sin(t)]},
  star:  (i,n,s)=>{const u=(i/n)*5,k=Math.floor(u),f=u-k,P=j=>{const a=-Math.PI/2+j*Math.PI*.8+s*.5;return[Math.cos(a),Math.sin(a)]};   // a pentagram drawn in one stroke
    const [ax,ay]=P(k),[bx,by]=P(k+1);return[ax+(bx-ax)*f,ay+(by-ay)*f]},
  eight: (i,n,s)=>{const u=i/n*TAU+s*.8;return[Math.sin(u)*1.35,Math.sin(2*u)*.62]}
};
const TAU=Math.PI*2;
function ringTL(cards,D){
  const L=S.L,R=Math.min(L.W*.4,L.H*.42,560),n=cards.length,g={r:0,spin:0,lift:140},tl=gsap.timeline();
  const kinds=Object.keys(RING_FORMS).filter(k=>k!==S.ringKind);S.ringKind=kinds[Math.floor(Math.random()*kinds.length)];
  const F=RING_FORMS[S.ringKind],sx=S.ringKind==='eight'?Math.min(1,(L.W*.46)/(R*1.35)):1;
  const base=cards.map((c,i)=>({tp:stackPose(c.idx,D),w:rand(-1,1),o:i%2}));
  const at=(i,spin,r,lift)=>{const b=base[i],k=r/R,[fx,fy]=F(i,n,spin,b.o),[gx,gy]=F(i+.05,n,spin,b.o);
    const a=Math.atan2(fy,fx),tan=Math.atan2(gy-fy,(gx-fx)*sx);
    return{x:D.x+fx*sx*r,y:D.y+fy*r,z:b.tp.z+lift+k*36*Math.sin(a*3+spin*3)+(b.o&&S.ringKind==='twin'?40*k:0),
      rotation:(tan/D2R)*k,rotationX:(-18+b.w*8)*k,rotationY:0,scale:1}};
  const upd=()=>cards.forEach((c,i)=>gsap.set(c.el,at(i,g.spin,g.r,g.lift)));
  // the formation turns, then bursts outward and every card is drawn back into one deck at the centre
  const SPIN=Math.PI*1.25,tB=RING_BURST,burst=cards.map((c,i)=>{
    const p=at(i,SPIN,R,140),dx=p.x-D.x,dy=p.y-D.y,len=Math.hypot(dx,dy),a=len>20?Math.atan2(dy,dx):rand(0,TAU),d=R*rand(.4,.8);
    return{x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,z:p.z+rand(80,280),rotation:p.rotation+rand(-170,170),rotationX:rand(-55,55),rotationY:rand(-45,45),scale:1}});
  tl.to(g,{r:R,duration:1.7,ease:'expo.out'},0)
    .to(g,{spin:SPIN,duration:tB,ease:'sine.in',onUpdate:upd},0)
    .add(()=>{Sound.whoosh();buzz(18)},tB)
    .to(STAR,{boost:1,duration:.25,ease:EO},tB).to(STAR,{boost:0,duration:1.2,ease:EI},tB+.25);
  cards.forEach((c,i)=>{
    tl.to(c.el,{...burst[i],duration:.55,ease:'power3.out'},tB)
      .to(c.el,{...base[i].tp,rotationX:0,rotationY:0,duration:1,ease:'power3.inOut'},tB+.55+Math.random()*.45);
  });
  tl.add(()=>cards.forEach((c,i)=>gsap.set(c.el,base[i].tp)),RING_DUR)
    .add(()=>Sound.whoosh(),0)
    .to(STAR,{warp:.35,duration:1.1,ease:EIO},.2).to(STAR,{warp:0,duration:1.6,ease:EO},2.2);
  return tl;
}
const RING_BURST=3.1,RING_DUR=RING_BURST+2.05;
async function newReading(){
  const L=S.L=computeLayout(),tl=gsap.timeline(),picked=S.picked.slice(),shown=picked.filter(c=>c.revealed),D=L.deckSetup;

    order.forEach(c=>{const p=pose({x:D.x,y:D.y,z:c.idx*TH+140});
      if(c.placed)tl.to(c.el,{...p,duration:1.6,ease:EIO},tC+picked.indexOf(c)*.14);

  }
  tl.add(ripple(),end-.2).add(pIn('#setup',{y:120}),end-.35).add(pIn('#deckHint',{y:20,d:.8}),end+.1)
    .add(()=>{S.picked=[];S.rest=[];S.fan=[];S.summary=false;$('#dockList').innerHTML='';S.rcards=[];$('#btnNew').style.display='none';

  const n=wax?clamp(Math.ceil(age),1,15):clamp(Math.ceil(age-SYN/2),1,15);

/* ---- reversed cards crack: dark-red fissures spread over the face ---- */
function crackSVG(){
  let seed=Math.random()*1e4;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  const paths=[];
  const branch=(x,y,a,len,depth)=>{
    let d=`M${x.toFixed(1)},${y.toFixed(1)}`;
    for(let s=0;s<len;s++){a+=(r()-.5)*.9;x=Math.min(276,Math.max(4,x+Math.cos(a)*14));y=Math.min(476,Math.max(4,y+Math.sin(a)*14));d+=`L${x.toFixed(1)},${y.toFixed(1)}`;
      if(depth<2&&r()<.18)branch(x,y,a+(r()<.5?-1:1)*(.6+r()*.6),Math.floor(len*.5),depth+1)}
    const sw=2.2-depth*.6;paths.push(`<path class="cg" d="${d}" pathLength="1" style="stroke-width:${(sw*3.2).toFixed(1)}"/><path d="${d}" pathLength="1" style="stroke-width:${sw.toFixed(1)}"/>`);
  };
  const starts=[[r()*280,0,Math.PI/2],[0,140+r()*200,0],[280,140+r()*200,Math.PI],[r()*280,480,-Math.PI/2]];
  starts.sort(()=>r()-.5).slice(0,3).forEach(([x,y,a])=>branch(x,y,a+(r()-.5)*.6,9+Math.floor(r()*8),0));
  return `<svg class="crk" viewBox="0 0 280 480" preserveAspectRatio="none" aria-hidden="true">${paths.join('')}</svg>`;
}

  if(!c.reversed||c.faceEl.querySelector('.crk'))return;

  if(RM())gsap.set(ps,{strokeDashoffset:0});
  else gsap.fromTo(ps,{strokeDasharray:1,strokeDashoffset:1},{strokeDashoffset:0,duration:.9,ease:'power2.out',stagger:.05,delay:.35});
}

/* ---- sound: ambient wind + fire crackle + low drone while sound is on; bell toll on reveal ---- */
const Amb={nodes:null,boost:null,timer:null};
function ambStart(){
  const c=Sound.ctx;if(!c||Amb.nodes)return;
  const master=c.createGain();master.gain.value=0;master.connect(Sound.out(c));
  master.gain.linearRampToValueAtTime(1,c.currentTime+2.5);
  const len=c.sampleRate*4,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3.5}               // brown-ish noise
  const wind=c.createBufferSource();wind.buffer=buf;wind.loop=true;
  const wf=c.createBiquadFilter();wf.type='bandpass';wf.frequency.value=380;wf.Q.value=.7;
  const wg=c.createGain();wg.gain.value=.05;
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.07;lg.gain.value=180;lfo.connect(lg).connect(wf.frequency);
  const lfo2=c.createOscillator(),lg2=c.createGain();lfo2.frequency.value=.11;lg2.gain.value=.025;lfo2.connect(lg2).connect(wg.gain);
  wind.connect(wf).connect(wg).connect(master);wind.start();lfo.start();lfo2.start();
  const drone=c.createGain();drone.gain.value=.018;const dl=c.createBiquadFilter();dl.type='lowpass';dl.frequency.value=220;drone.connect(dl).connect(master);
  const os=[55,82.4,110.3].map(f=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=rand(-6,6);o.connect(drone);o.start();return o});
  Amb.nodes={master,wind,lfo,lfo2,os,drone};Amb.boost=drone.gain;
  const crack=()=>{if(!Amb.nodes)return;Sound.crackle(1+Math.floor(Math.random()*3),.03);Amb.timer=setTimeout(crack,rand(120,900))};crack();
}
function ambStop(){
  const n=Amb.nodes,c=Sound.ctx;if(!n||!c)return;Amb.nodes=null;clearTimeout(Amb.timer);
  n.master.gain.cancelScheduledValues(c.currentTime);n.master.gain.setTargetAtTime(0,c.currentTime,.4);
  setTimeout(()=>{try{n.wind.stop();n.lfo.stop();n.lfo2.stop();n.os.forEach(o=>o.stop());n.master.disconnect()}catch(e){}},2000);
}
function ambBoost(on){const c=Sound.ctx;if(!Amb.boost||!c)return;Amb.boost.setTargetAtTime(on?.04:.018,c.currentTime,.8)}
Sound.crackle=function(n=8,g=.07){
  if(!this.on||!this.ctx)return;for(let i=0;i<n;i++)this.click(Math.random()*.6,g*(.4+Math.random()),rand(1800,5200),rand(.008,.03));
};
Sound.bell=function(){
  if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime;
  [[196,.07,5],[392*1.19,.04,3.2],[196*2.76,.03,2.4],[196*5.4,.015,1.4],[98,.05,6]].forEach(([f,g,d])=>{
    const o=c.createOscillator(),v=c.createGain();o.type='sine';o.frequency.value=f;
    v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(v).connect(Sound.out(c));o.start(t);o.stop(t+d+.1)});
};
Sound.boom=function(){
  if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(32,t+1.6);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
  o.connect(g).connect(Sound.out(c));o.start(t);o.stop(t+2.3);this.bell();
};

  const _toggle=Sound.toggle;Sound.toggle=function(){_toggle.call(this);this.on?ambStart():ambStop()};

}

   The sound button opens a small panel with a gold dial: drag around the ring (or scroll / arrow keys)
   to turn the volume; the sigil in the middle turns with it and the ember glow grows with loudness.
   ====================================================================== */
(function volumeDial(){
  const R=62,A0=135,SW=270,P=a=>[R*Math.cos(a*D2R),R*Math.sin(a*D2R)].map(n=>n.toFixed(2)).join(',');
  const arc=`M${P(A0)}A${R},${R} 0 1 1 ${P(A0+SW)}`;
  const ticks=Array.from({length:25},(_,i)=>{const a=(A0+i*SW/24)*D2R,big=i%4===0,r1=big?68:70,r2=big?78:75;
    return `<line x1="${(r1*Math.cos(a)).toFixed(1)}" y1="${(r1*Math.sin(a)).toFixed(1)}" x2="${(r2*Math.cos(a)).toFixed(1)}" y2="${(r2*Math.sin(a)).toFixed(1)}" class="${big?'tb':''}"/>`}).join('');
  const pop=document.createElement('div');pop.id='volPop';pop.className='glass';pop.setAttribute('role','dialog');pop.setAttribute('aria-label','ระดับเสียง');pop.hidden=true;
  pop.innerHTML=`<div class="vtitle">ระดับเสียง</div>
    <div id="volDial" role="slider" tabindex="0" aria-label="ระดับเสียง" aria-valuemin="0" aria-valuemax="100">
      <div class="vflame"></div><img class="vsig" src="assets/sigil.webp" alt="" draggable="false">
      <svg viewBox="-82 -82 164 164" aria-hidden="true"><g class="ticks">${ticks}</g>
        <path class="track" d="${arc}"/><path class="fill" d="${arc}" pathLength="1"/>
        <g class="needle"><polygon points="56,0 70,-5 84,0 70,5"/><circle cx="70" cy="0" r="2.2"/></g></svg>
      <output class="vnum"></output></div>
    <button class="btn small" id="volMute" type="button">ดับเสียง</button>`;
  $('#stage').appendChild(pop);
  const dial=$('#volDial'),fill=pop.querySelector('.fill'),needle=pop.querySelector('.needle'),sig=pop.querySelector('.vsig'),fl=pop.querySelector('.vflame'),num=pop.querySelector('.vnum');
  let lastTick=Sound.v;
  function render(){
    const v=Sound.v;fill.style.strokeDasharray=`${v} 1`;needle.setAttribute('transform',`rotate(${A0+SW*v})`);
    gsap.to(sig,{rotation:v*540,opacity:.3+.6*v,duration:.4,ease:EO,overwrite:'auto'});
    gsap.to(fl,{scale:.45+v*.9,opacity:.25+v*.75,duration:.4,ease:EO,overwrite:'auto'});
    num.textContent=Math.round(v*100);dial.setAttribute('aria-valuenow',Math.round(v*100));dial.setAttribute('aria-valuetext',Math.round(v*100)+'%');
  }
  function set(v){
    if(!Sound.on&&v>0){Sound.toggle()}
    Sound.setVol(v);render();
    if(Math.abs(Sound.v-lastTick)>=.06){lastTick=Sound.v;Sound.click(0,.14,2600+Sound.v*2400,.03)}
  }
  function place(){const r=$('#btnSound').getBoundingClientRect(),w=pop.offsetWidth||210;pop.style.left=clamp(r.left,8,innerWidth-w-8)+'px';pop.style.top=(r.bottom+10)+'px'}
  function open(){
    if(!pop.hidden)return;pop.hidden=false;place();render();
    gsap.fromTo(pop,{autoAlpha:0,y:-10,scale:.9,transformOrigin:'20% 0%'},{autoAlpha:1,y:0,scale:1,duration:RM()?.01:.35,ease:'back.out(1.8)'});
    gsap.fromTo(sig,{rotation:Sound.v*540-120},{rotation:Sound.v*540,duration:RM()?.01:.9,ease:EO});
  }
  function close(){if(pop.hidden)return;gsap.to(pop,{autoAlpha:0,y:-8,duration:RM()?.01:.2,ease:EI,onComplete:()=>{pop.hidden=true}})}
  // drag around the ring
  let drag=false;
  const fromPoint=e=>{const r=dial.getBoundingClientRect(),a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))/D2R;
    let rel=((a-A0)%360+360)%360;if(rel>SW)rel=rel>SW+(360-SW)/2?0:SW;return rel/SW};
  dial.addEventListener('pointerdown',e=>{drag=true;dial.setPointerCapture(e.pointerId);set(fromPoint(e));e.preventDefault()});
  dial.addEventListener('pointermove',e=>{if(drag)set(fromPoint(e))});
  dial.addEventListener('pointerup',()=>{drag=false});dial.addEventListener('pointercancel',()=>{drag=false});
  dial.addEventListener('wheel',e=>{e.preventDefault();set(Sound.v-e.deltaY*.0009)},{passive:false});
  dial.addEventListener('keydown',e=>{const k=e.key,s=e.shiftKey?.1:.05;
    if(k==='ArrowUp'||k==='ArrowRight'){set(Sound.v+s);e.preventDefault()}else if(k==='ArrowDown'||k==='ArrowLeft'){set(Sound.v-s);e.preventDefault()}
    else if(k==='Home'){set(0);e.preventDefault()}else if(k==='End'){set(1);e.preventDefault()}else if(k==='Escape'){close();$('#btnSound').focus()}});
  $('#volMute').addEventListener('click',()=>{if(Sound.on)Sound.toggle();close()});
  // sound button: first press switches sound on and opens the dial, later presses open/close it
  $('#btnSound').onclick=()=>{if(!Sound.on){Sound.toggle();open()}else if(pop.hidden)open();else close()};
  document.addEventListener('pointerdown',e=>{if(!pop.hidden&&!pop.contains(e.target)&&!$('#btnSound').contains(e.target))close()},true);
  addEventListener('resize',()=>{if(!pop.hidden)place()});
  render();
})();

</script>
</body>
</html>
