<style>
/* ============ BASE ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#0a0a0d;--gold:#b8955a;--gold2:#dcc28c;--ink:#e6dfcf;--muted:#9d978b;--line:rgba(184,149,90,.38);--glass:rgba(17,16,20,.86);--ember:#d98a4a;
  --cw:110px;--ch:calc(var(--cw)*12/7)}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:'Noto Serif Thai','Cinzel',serif;overflow:hidden;overscroll-behavior:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
body{background:radial-gradient(ellipse 90% 55% at 50% 112%,#2a1d14 0%,rgba(42,29,20,0) 70%),radial-gradient(ellipse 80% 50% at 50% -12%,#17171d 0%,rgba(23,23,29,0) 70%),var(--navy)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
/* drifting fog banks between the ash particles and the table */
#fog{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fog i{position:absolute;width:150vmax;height:70vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(150,142,132,.10),rgba(150,142,132,.04) 55%,transparent);will-change:transform}
#fog i:nth-child(1){left:-70vmax;top:35%;animation:fogA 70s ease-in-out infinite alternate}
#fog i:nth-child(2){right:-75vmax;top:-10%;animation:fogB 90s ease-in-out infinite alternate;opacity:.8}
#fog i:nth-child(3){left:-20vmax;bottom:-45vmax;animation:fogA 110s ease-in-out infinite alternate-reverse;opacity:.9}
@keyframes fogA{to{transform:translate(45vmax,-6vmax)}}
@keyframes fogB{to{transform:translate(-40vmax,8vmax)}}
#vign{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}
#stage{position:fixed;inset:0;overflow:hidden;z-index:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gl{opacity:0;visibility:hidden}

/* ============ TITLE / INTRO ============ */
#title{position:fixed;left:50%;top:50%;z-index:9;display:flex;gap:.3em;margin:0;font-family:'Cinzel',serif;font-weight:400;font-size:clamp(40px,14vw,200px);
  color:var(--gold);white-space:nowrap;line-height:1;pointer-events:none;will-change:transform;text-shadow:0 0 30px rgba(184,149,90,.35)}
#title .L{position:relative;display:inline-block;will-change:transform,opacity;opacity:0;visibility:hidden}
#title .L b{font-weight:400}
#title .hi{position:absolute;left:0;top:0;font-style:normal;color:#fff6d6;opacity:0;text-shadow:0 0 18px rgba(255,240,190,.9)}
#tagline{position:fixed;left:50%;top:50%;z-index:9;margin:0;font-size:clamp(14px,2.2vw,20px);font-weight:400;color:var(--muted);text-align:center;width:90vw;opacity:0;visibility:hidden}
#beginBtn{position:fixed;left:50%;top:50%;z-index:9;border:1px solid var(--gold);background:rgba(22,21,26,.5);color:var(--gold2);border-radius:10px;padding:12px 44px;
  font-size:18px;letter-spacing:.02em;transition:background-color .2s,border-color .2s;opacity:0;visibility:hidden}
#beginBtn:hover,#beginBtn:focus-visible{background:rgba(184,149,90,.18);border-color:var(--gold2);outline:none}
#beginBtn:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}

/* ============ HUD ============ */
#hud{position:fixed;top:0;left:0;z-index:10;display:flex;gap:8px;padding:12px 14px;opacity:0;visibility:hidden}
.btn{border:1px solid var(--line);background:rgba(22,21,26,.6);color:var(--gold2);border-radius:10px;padding:8px 16px;font-size:14px;transition:background-color .2s,border-color .2s}
.btn:active{scale:.98}
.btn:hover{border-color:var(--gold2);background:rgba(34,31,36,.8)}
.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,#dcc28c,#c4a066);color:#17130e;border-color:#dcc28c;font-weight:600;padding:12px 28px;font-size:16px}
.btn.small{padding:6px 12px;font-size:13px}
.btn.primary:hover{background:linear-gradient(180deg,#e6cf9e,#cfac72);border-color:#e6cf9e}
/* one line icon set (lucide shapes), one size and stroke, colour from the text */
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

/* ============ TABLE: cards + slots ============ */
/* 3D world: #table(perspective) > #cam(tilt/dolly) > #bob(idle sway) > #world(parallax) */
#table{position:fixed;inset:0;z-index:2;perspective:1700px;perspective-origin:50% 46%;pointer-events:none}
#cam,#bob,#world{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;will-change:transform}
.card,.hov,.sz,.rev,.flip{transform-style:preserve-3d}
/* card art is laid out at --cwx and scaled down to the logical --cw (sharp raster); --u = one on-screen px inside it */
.sz{position:absolute;left:50%;top:50%;width:var(--cwx,110px);height:calc(var(--cwx,110px)*12/7);margin:calc(var(--cwx,110px)*-6/7) 0 0 calc(var(--cwx,110px)/-2);scale:var(--ck,1);--u:calc(1px / var(--ck,1))}
.card,.slot{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);will-change:transform}
.card{outline:none;user-select:none;-webkit-user-select:none;opacity:0;visibility:hidden}
[data-state=reveal] .card.placed,[data-state=reading] .card.placed{pointer-events:auto;cursor:pointer}
.slot svg{width:100%;height:100%;overflow:visible;display:block}
.slot rect{fill:rgba(22,21,26,.28);stroke:var(--gold);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;stroke-opacity:.55;transition:stroke-opacity .4s}
.slot rect{filter:drop-shadow(0 0 3px rgba(220,190,130,.5))}
.slot.next rect{stroke:var(--gold2);stroke-opacity:1;animation:pad 1.6s ease-in-out infinite alternate}
@keyframes pad{from{stroke-opacity:.45}to{stroke-opacity:1}}
.slot.used rect{stroke-opacity:.18}
.slbl{position:absolute;left:50%;top:50%;font-size:13px;color:var(--gold2);white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;opacity:0;visibility:hidden;text-shadow:0 0 6px #0a0a0d,0 0 10px #0a0a0d}
.hov,.rev,.flip,.back,.face{position:absolute;inset:0}
.flip{transform-style:preserve-3d}
.back,.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:5.2%/3%;overflow:hidden}
.back{box-shadow:0 0 0 calc(.7*var(--u)) rgba(220,190,130,.45);background:#15141a var(--backImg) center/100% 100% no-repeat}
.mand{position:absolute;inset:0;background:var(--mandImg) center/100% auto no-repeat}
.card.top .mand,.card.placed .mand{animation:spin 120s linear infinite}
.card.top .back,.card.placed .back{box-shadow:0 calc(4*var(--u)) calc(14*var(--u)) rgba(0,0,0,.6)}
.face{transform:rotateY(180deg)}
.back svg,.face svg,.face img{width:100%;height:100%;display:block}
.card.lift .back{box-shadow:0 0 0 calc(1.5*var(--u)) var(--gold2),0 0 calc(22*var(--u)) calc(5*var(--u)) rgba(220,190,130,.7)}
.card:focus-visible .back,.card:focus-visible .face{box-shadow:0 0 0 calc(2*var(--u)) var(--gold2),0 0 calc(22*var(--u)) calc(5*var(--u)) rgba(220,190,130,.7)}
.card.revealed .face{box-shadow:0 0 calc(18*var(--u)) calc(2*var(--u)) rgba(220,190,130,.4)}
.card.armed .back{box-shadow:0 0 0 calc(2*var(--u)) var(--gold2),0 0 calc(24*var(--u)) calc(6*var(--u)) rgba(220,190,130,.8)}
.rot{transform-box:fill-box;transform-origin:center;animation:spin 120s linear infinite;animation-play-state:paused}
.card.top .rot,.card.placed .rot{animation-play-state:running}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 46s linear infinite}
.tw{animation:tw 2.6s ease-in-out infinite alternate}
.flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-28}}
.cardsvg .s{fill:none;stroke:#d4af6a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cardsvg .t{stroke-width:1.2}
.cardsvg .k{stroke-width:4}
.cardsvg .f{fill:#d4af6a;stroke:none}
.cardsvg .f2{fill:#f2d48a;stroke:none}
.cardsvg .n{fill:#1b2a5c;stroke:#d4af6a;stroke-width:1.8;stroke-linejoin:round}
.cardsvg .d{fill:#0a0a0d;stroke:#d4af6a;stroke-width:1.6;stroke-linejoin:round}
.cardsvg .w{fill:none;stroke:#9db8ff;stroke-width:2;stroke-linecap:round}
.cardsvg .num{font-family:'Cinzel',serif;font-size:22px;fill:#f2d48a;letter-spacing:.12em}
.cardsvg .en{font-family:'Cinzel',serif;font-size:16.5px;fill:#f2d48a;letter-spacing:.06em}
.cardsvg .th{font-family:'Noto Serif Thai',serif;font-size:15px;fill:#d4af6a}
#ripple{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:2px solid var(--gold2);
  box-shadow:0 0 30px rgba(220,190,130,.6),inset 0 0 30px rgba(220,190,130,.4);opacity:0;visibility:hidden;z-index:3;pointer-events:none;will-change:transform,opacity}

.glare{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:5.2%/3%;overflow:hidden;clip-path:inset(0 round 5.2% / 3%);pointer-events:none}
.glare i{position:absolute;inset:-10% -60%;background:linear-gradient(105deg,transparent 38%,rgba(255,244,210,.65) 50%,transparent 62%);opacity:0}
.beam{position:fixed;left:0;top:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,236,180,.9),rgba(220,190,130,.35) 35%,transparent 70%);mix-blend-mode:screen;will-change:transform,opacity}
#halo{position:fixed;left:50%;top:50%;width:min(92vmin,820px);height:min(92vmin,820px);margin:calc(min(92vmin,820px)/-2) 0 0 calc(min(92vmin,820px)/-2);z-index:8;pointer-events:none;opacity:0;visibility:hidden;will-change:transform,opacity}
#halo svg,#halo img{width:100%;height:100%;display:block;animation:spin 140s linear infinite}
#halo img{opacity:.3;filter:drop-shadow(0 0 18px rgba(217,138,74,.35))}
#tagline,#beginBtn{text-shadow:0 0 8px #050507,0 0 16px #050507}
#logoSlot{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9;pointer-events:none}
#logoSlot #title{position:static;font-size:26px;gap:.3em;text-shadow:0 0 14px rgba(184,149,90,.5)}
#title{perspective:900px}
.opt .dg{display:block;height:26px;margin:0 auto 4px}
.opt .dg svg{height:100%;width:auto;overflow:visible}
.opt .dg rect{fill:rgba(184,149,90,.12);stroke:var(--gold);stroke-width:1.2}
.opt[aria-pressed=true] .dg rect{fill:rgba(220,190,130,.4);stroke:var(--gold2)}

/* ============ PANELS ============ */
.panel{position:fixed;z-index:6;left:50%;opacity:0;visibility:hidden;will-change:transform,opacity}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#setup{bottom:max(14px,env(safe-area-inset-bottom));width:min(560px,94vw);padding:14px 16px 16px;display:grid;gap:10px;text-align:center}
#question{width:100%;background:rgba(22,21,26,.7);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 16px;font:inherit;font-size:16px;text-align:center;touch-action:auto}
#question::placeholder{color:#8f8b7d}
#question:focus{outline:none;border-color:var(--gold2);background:rgba(28,26,31,.8)}
.spreads{display:flex;gap:8px}
.opt{flex:1 1 0;min-width:0;border:1px solid var(--line);background:rgba(22,21,26,.7);border-radius:10px;padding:8px 4px;text-align:center;transition:background-color .2s,border-color .2s}
.opt:hover{border-color:rgba(220,194,140,.6)}
.opt b{display:block;font-weight:600;font-size:14.5px}
.opt span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.35}
.opt[aria-pressed=true]{border-color:var(--gold2);background:rgba(184,149,90,.18)}
.opt:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.slider label{display:block;font-size:16px;color:var(--gold2);margin-bottom:2px}
input[type=range]{width:100%;accent-color:var(--gold);touch-action:auto}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 3px}
#shufUI{top:0;width:min(420px,90vw);text-align:center;padding:0}
#counter{margin:0;font-size:clamp(18px,3.4vw,24px);color:var(--gold2);font-variant-numeric:tabular-nums}
#shufKind{margin:2px 0 0;font-size:13px;color:var(--muted)}
#prompt{top:62px;width:min(560px,92vw);text-align:center;margin:0}
#prompt p{margin:0;font-size:clamp(18px,3.4vw,24px);color:var(--gold2)}
#prompt small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
#hintPos{position:fixed;left:50%;top:0;z-index:6;width:min(520px,70vw);pointer-events:none;will-change:transform}
#hintRow{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;visibility:hidden;pointer-events:none}
#hintRow>*{pointer-events:auto}
#hintRow p{margin:0;font-size:clamp(15px,2.6vw,19px);color:var(--gold2)}

/* ============ DOCK (readings) ============ */
#dock{position:fixed;z-index:7;display:flex;flex-direction:column;background:rgba(13,12,16,.93);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;visibility:hidden;will-change:transform,opacity;touch-action:pan-y}
#dock.wide{top:0;right:0;bottom:0;width:var(--dockW);border-radius:16px 0 0 16px}
#dock.narrow{left:0;right:0;bottom:0;height:var(--dockH);border-radius:16px 16px 0 0}
#dockHead{display:flex;align-items:center;min-height:44px;padding:0 14px 0 48px;position:relative;flex:none;border-bottom:1px solid rgba(184,149,90,.2);color:var(--gold2);font-size:15px}
#dockToggle{position:absolute;left:0;top:0;width:46px;height:44px;border:0;background:none;color:var(--gold2);display:flex;align-items:center;justify-content:center}
#dock.narrow #dockToggle svg{transition:transform .5s}#dock.narrow.peek #dockToggle svg{transform:rotate(180deg)}
#dock.wide #dockToggle svg{transform:rotate(-90deg)}
#dockList{overflow-y:auto;overflow-x:hidden;flex:1;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent;touch-action:pan-y}
.rcard{border:1px solid rgba(184,149,90,.28);border-radius:14px;padding:12px 14px;background:rgba(22,21,26,.55);line-height:1.8;font-size:15px;will-change:transform,opacity}
.rcard.sum{border-color:var(--gold2);background:rgba(184,149,90,.1);position:relative}
/* ============ SCENE ART ============ */
#bgimg{position:fixed;inset:-4%;z-index:0;pointer-events:none;background:url(assets/bg.webp) center/cover no-repeat;opacity:0;visibility:hidden;will-change:transform,opacity}
@media (max-aspect-ratio:1/1){#bgimg{background-image:url(assets/bg_m.webp)}}
#altar{position:absolute;left:50%;top:50%;pointer-events:none;opacity:0;visibility:hidden;background:url(assets/table.webp) center/cover;
  -webkit-mask:radial-gradient(ellipse closest-side,#000 52%,transparent 100%);mask:radial-gradient(ellipse closest-side,#000 52%,transparent 100%)}
#altar>i{position:absolute;left:50%;top:50%;width:var(--sig,400px);height:var(--sig,400px);margin:calc(var(--sig,400px)/-2) 0 0 calc(var(--sig,400px)/-2);
  background:url(assets/sigil.webp) center/contain no-repeat;opacity:.3;animation:spin 180s linear infinite;--sr:0deg;rotate:var(--sr)}
.kindled #altar>i{filter:drop-shadow(0 0 14px rgba(255,140,60,.55))}
/* ============ SOULSLIKE ATMOSPHERE ============ */
/* candles on the altar, seen from above */
#altar .cdl{position:absolute;left:calc(50% + var(--sig,400px)*var(--x)*.5);top:calc(50% + var(--sig,400px)*var(--y)*.5);width:0;height:0}
#altar .cdl i{position:absolute;left:0;top:0;border-radius:50%;translate:-50% -50%}
#altar .pool{width:calc(var(--sig,400px)*.55);height:calc(var(--sig,400px)*.55);background:radial-gradient(circle closest-side,rgba(255,160,80,.2),rgba(255,120,50,.07) 50%,transparent);animation:cflick 2.3s var(--d) ease-in-out infinite}
#altar .wax{width:22px;height:22px;background:radial-gradient(circle at 40% 35%,#efe4cc,#b9a685 60%,#6d5d45);box-shadow:0 0 0 3px rgba(40,34,28,.7),0 0 0 6px rgba(255,170,90,.12)}
#altar .flm{width:10px;height:10px;background:radial-gradient(circle,#fff8e0,#ffc261 45%,rgba(255,120,40,0) 75%);box-shadow:0 0 14px 6px rgba(255,170,80,.55);animation:fflick .16s var(--d) infinite alternate}
@keyframes cflick{0%,100%{opacity:.85;scale:1}23%{opacity:1;scale:1.04}41%{opacity:.78;scale:.98}67%{opacity:.95;scale:1.02}}
@keyframes fflick{from{opacity:.8;scale:.9}to{opacity:1;scale:1.12}}
/* lantern: warm pool of light following the pointer, darkness around it */
#lantern{position:fixed;left:0;top:0;width:0;height:0;z-index:3;pointer-events:none}
#lantern::before{content:"";position:absolute;width:300vmax;height:300vmax;left:-150vmax;top:-150vmax;
  background:radial-gradient(circle closest-side,transparent 0,transparent 13%,rgba(0,0,0,.16) 24%,rgba(0,0,0,.4) 46%);transition:opacity .8s}
#lantern i{position:absolute;width:76vmin;height:76vmin;left:-38vmin;top:-38vmin;border-radius:50%;background:radial-gradient(circle closest-side,rgba(255,176,105,.12),rgba(255,140,60,.045) 55%,transparent);animation:lflick 3.4s ease-in-out infinite}
@keyframes lflick{0%,100%{opacity:.9}18%{opacity:1}36%{opacity:.82}52%{opacity:.97}74%{opacity:.86}}
[data-state=gallery] #lantern::before{opacity:.45}
/* the souls banner */
#soulMsg{position:fixed;left:0;right:0;top:50%;translate:0 -50%;z-index:9;pointer-events:none;text-align:center;padding:36px 16px 30px;opacity:0;visibility:hidden;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.8) 16%,rgba(0,0,0,.8) 84%,transparent)}
#soulMsg b{display:block;font-family:'Cinzel',serif;font-weight:400;font-size:clamp(26px,5.2vw,72px);letter-spacing:.14em;color:#e9cf97;text-shadow:0 0 26px rgba(233,170,90,.55),0 0 2px #fff3d0;line-height:1.15}
#soulMsg small{display:block;margin-top:8px;font-size:clamp(13px,1.6vw,18px);letter-spacing:.18em;color:var(--muted)}
/* reversed cards: dark-red fissures */
.crk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:hidden;clip-path:inset(0 round 5.2% / 3%)}
.crk path{fill:none;stroke:#3d0906;stroke-linecap:round;stroke-linejoin:round}
.crk .cg{stroke:rgba(255,70,30,.32)}   /* glow drawn as a wide soft stroke: no filter, so it clips cleanly when the card tilts */
/* burning card face */
.card.burning .face{-webkit-mask-image:radial-gradient(circle at var(--bx,50%) var(--by,80%),transparent calc(var(--burn,0)*1%),#000 calc(var(--burn,0)*1% + 4%));
  mask-image:radial-gradient(circle at var(--bx,50%) var(--by,80%),transparent calc(var(--burn,0)*1%),#000 calc(var(--burn,0)*1% + 4%))}
.card.burning .face::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at var(--bx,50%) var(--by,80%),
  transparent calc(var(--burn,0)*1% - 1%),rgba(255,214,150,.95) calc(var(--burn,0)*1% + .5%),rgba(255,110,30,.9) calc(var(--burn,0)*1% + 2%),
